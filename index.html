<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tableau de bord RH — Groupe Edgard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#C9A84C;--dk:#1A1A1A;--md:#666;--lt:#F9F7F2;--bd:#E0DCD0;--green:#27AE60;--orange:#E67E22;--red:#C0392B;--blue:#2980B9;--purple:#8E44AD}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F2EFE8;min-height:100vh;padding:20px 14px 60px;color:var(--dk)}

#gate{position:fixed;inset:0;background:#F2EFE8;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);max-width:360px;width:100%;padding:30px 26px;text-align:center}
.gate-box h2{font-family:'Playfair Display',serif;font-size:19px;margin-bottom:4px}
.gate-box p{font-size:12.5px;color:#666;margin-bottom:18px}
.gate-box input{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:6px;margin-bottom:10px;font-size:15px;font-family:'DM Sans',sans-serif;text-align:center;letter-spacing:.2em}
.gate-box button{width:100%;padding:11px;background:var(--dk);color:#fff;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer}
#gateErr{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}

#app{display:none}

.hdr{max-width:1800px;margin:0 auto 18px;padding:0 4px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.hdr h1{font-family:'Playfair Display',serif;font-size:22px;color:var(--dk)}
.hdr .sub{font-size:12px;color:var(--md);margin-top:2px}
.refresh{background:var(--dk);color:#fff;border:none;padding:9px 18px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.refresh:hover{background:#333}

.panel-grid{max-width:1800px;margin:0 auto;padding:0 4px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;align-items:start}
@media(max-width:760px){
  .panel-grid{grid-template-columns:repeat(2,1fr)}
  #sec-cp{order:1}
  #sec-samedi{order:2}
  #sec-var{order:3}
  #sec-hsac{order:4}
}
.panel{background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);overflow:hidden;border-top:5px solid var(--pc);cursor:pointer;transition:box-shadow .15s}
.panel:hover{box-shadow:0 6px 22px rgba(0,0,0,.1)}
.panel.expanded{grid-column:1/-1;cursor:default}
.panel-face{padding:20px 18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.panel-face .n{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;line-height:1;color:var(--dk)}
.panel-face .n.ok{color:var(--green)}
.panel-face .l{font-size:10.5px;color:var(--md);text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
.panel-face .chev{display:none;font-size:16px;color:var(--md);transition:transform .15s;flex:0 0 auto}
.panel.expanded .panel-face{flex-direction:row;align-items:center;justify-content:space-between;text-align:left;padding:20px 24px 16px;border-bottom:1px solid var(--bd);gap:14px}
.panel.expanded .panel-face .n{font-size:24px}
.panel.expanded .panel-face .l{margin-top:6px;max-width:260px}
.panel.expanded .chev{display:block;transform:rotate(180deg)}
.panel-preview{padding:0 16px 16px;display:flex;flex-direction:column;gap:4px;min-height:18px}
.panel.expanded .panel-preview{display:none}
.panel-preview .pv-item{font-size:10.5px;color:var(--md);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-preview .pv-more{font-size:10px;color:#aaa;font-style:italic}
.panel-detail{display:none}
.panel.expanded .panel-detail{display:block;padding:16px 24px 22px;cursor:default}
.panel-note{font-size:11px;color:#999;margin-bottom:10px}
.panel-toolbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.panel-toolbar select{font-family:'DM Sans',sans-serif;font-size:12.5px;padding:7px 12px;border:1.5px solid var(--bd);border-radius:7px;background:#fff;color:var(--dk);cursor:pointer}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding:3px 8px;border-radius:5px;flex:0 0 auto;white-space:nowrap}
.tag.en_attente,.tag.incomplet,.tag.reseau,.tag.dir,.tag.rh1,.tag.resp{background:#FDEBD8;color:#a3560f}
.tag.non_envoye{background:#FADBD8;color:#943126}
.tag.complet{background:#D5F5E3;color:#1e7a45}
.empty{color:var(--md);font-size:12.5px;padding:14px 0;text-align:center}

.var-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:6px 0 12px}
.var-card{border-radius:10px;padding:14px 10px 12px;text-align:center;border:1.5px solid var(--bd);background:#FBFAF7}
.var-card .code{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;letter-spacing:.2px}
.var-card .dir{font-size:11px;color:var(--md);margin-top:3px;line-height:1.3;min-height:28px}
.var-card .badge{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:8px}
.var-card .sig{font-size:10px;color:var(--md);margin-top:4px}
.var-card.non_envoye{border-color:#F3C6B8;background:#FDF4F1}
.var-card.non_envoye .badge{background:#FADBD8;color:#943126}
.var-card.incomplet{border-color:#F6DCA8;background:#FEFAF0}
.var-card.incomplet .badge{background:#FDEBD8;color:#a3560f}
.var-card button{display:block;margin:8px auto 0;font-size:9.5px;padding:4px 10px;border-radius:14px;border:1px solid var(--bd);background:#fff;color:var(--md);cursor:pointer;font-family:'DM Sans',sans-serif}
.var-card button:hover{background:var(--dk);color:#fff;border-color:var(--dk)}
.var-card button.relance{margin-top:6px;border-color:var(--blue);color:var(--blue)}
.var-card button.relance:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.var-card button.relance:disabled{opacity:.55;cursor:default;background:#fff;color:var(--blue)}
.var-card .portal{margin-top:9px;padding-top:8px;border-top:1px dashed var(--bd)}
.var-card .portal a{display:inline-block;font-size:10.5px;font-weight:700;color:var(--blue);text-decoration:none}
.var-card .portal a:hover{text-decoration:underline}
.var-card .portal .pin{font-size:10px;color:var(--md);margin-top:3px}
.var-card .portal .pin b{font-family:'Playfair Display',serif;letter-spacing:.15em;color:var(--dk);font-size:12px}
.panel-toolbar select{margin-left:8px}
.panel-toolbar .tb-label{font-size:11px;color:var(--md);align-self:center}

.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:6px 0 12px}
.item-card{border-radius:10px;padding:14px 16px;border:1.5px solid var(--bd);background:#FEFAF0;display:flex;flex-direction:column;gap:7px}
.item-card.non_envoye{border-color:#F3C6B8;background:#FDF4F1}
.item-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-card .who{font-weight:700;font-size:14px;line-height:1.3}
.item-card .tag{flex:0 0 auto}
.item-card .meta{color:var(--md);font-size:12px;line-height:1.4}
.item-card .since{color:#999;font-size:10.5px;margin-top:auto;padding-top:2px}
.item-card .btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.item-card button.relance{display:inline-block;font-size:9.5px;padding:4px 10px;border-radius:14px;border:1px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;font-family:'DM Sans',sans-serif}
.item-card button.relance:hover{background:var(--blue);color:#fff}
.item-card button.relance:disabled{opacity:.55;cursor:default;background:#fff;color:var(--blue)}
.item-card button.delete{display:inline-block;font-size:9.5px;padding:4px 10px;border-radius:14px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;font-family:'DM Sans',sans-serif}
.item-card button.delete:hover{background:var(--red);color:#fff}
.item-card button.delete:disabled{opacity:.55;cursor:default;background:#fff;color:var(--red)}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h2>Tableau de bord RH</h2>
    <p>Réservé au service RH — saisissez le code d'accès</p>
    <input type="password" id="gatePin" placeholder="Code d'accès" maxlength="12">
    <button type="button" onclick="tryGate()">Accéder</button>
    <div id="gateErr"></div>
  </div>
</div>

<div id="app">

<div class="hdr">
  <div>
    <h1>Tableau de bord RH — Groupe Edgard</h1>
    <div class="sub" id="lastUpdate">Chargement...</div>
  </div>
  <button class="refresh" onclick="loadAll()">↻ Actualiser</button>
</div>

<div class="panel-grid" id="panels"></div>

</div>

<script>
/* ============================ CONFIG ============================ */
var RH_CODE = 'Edgard37*'; // code d'accès partagé service RH

var N8N_DEMANDES  = 'https://edgard-opticiens.app.n8n.cloud/webhook/get-demandes';
var N8N_VARIABLES = 'https://edgard-opticiens.app.n8n.cloud/webhook/get-variables-paie';
var N8N_VAR_FINALIZE = 'https://edgard-opticiens.app.n8n.cloud/webhook/finaliser-variable-paie';
var N8N_VAR_RELANCE = 'https://edgard-opticiens.app.n8n.cloud/webhook/variables-relance-manuelle';
var N8N_CP_RELANCE = 'https://edgard-opticiens.app.n8n.cloud/webhook/conges-relance-manuelle';
var N8N_CP_SUPPRIMER = 'https://edgard-opticiens.app.n8n.cloud/webhook/conges-supprimer-manuelle';
var N8N_SAMEDIS   = 'https://edgard-opticiens.app.n8n.cloud/webhook/get-samedis-tournant';
var N8N_HS        = 'https://edgard-opticiens.app.n8n.cloud/webhook/get-heures-sup';
var N8N_ACOMPTE   = 'https://edgard-opticiens.app.n8n.cloud/webhook/get-acompte';
var VAR_PERIODE_DEBUT = '2026-09'; // premier mois suivi dans l'historique

var VAR_PORTAL_BASE = 'https://edgard-opticiens.github.io/variables/';
var VAR_DATA_BASE = 'https://raw.githubusercontent.com/edgard-opticiens/variables/main/data/';
var PIN_CACHE = {};

function tryGate(){
  var pin = document.getElementById('gatePin').value.trim();
  var err = document.getElementById('gateErr');
  if (pin !== RH_CODE){ err.textContent = 'Code incorrect.'; document.getElementById('gatePin').value=''; return; }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAll();
  setInterval(loadAll, 300000);
}
document.getElementById('gatePin').addEventListener('keydown', function(e){ if(e.key==='Enter') tryGate(); });

/* ============================ HELPERS ============================ */
function excelOrIsoDate(v){
  if (v==='' || v===null || v===undefined) return null;
  if (typeof v==='number' || /^\d+(\.\d+)?$/.test(v)) return new Date((Number(v)-25569)*86400000);
  var d = new Date(v);
  return isNaN(d) ? null : d;
}
function dedupeLatest(arr){
  var byId = {};
  arr.forEach(function(d){
    var id = d.id;
    if (!id){ byId[Math.random()] = d; return; }
    if (!byId[id] || new Date(d.date_derniere_action) > new Date(byId[id].date_derniere_action)) byId[id] = d;
  });
  return Object.values(byId);
}
function joursDepuis(dateVal){
  var d = excelOrIsoDate(dateVal);
  if (!d) return '';
  var days = Math.floor((new Date() - d) / 86400000);
  if (days <= 0) return 'aujourd\'hui';
  if (days === 1) return 'depuis 1 jour';
  return 'depuis ' + days + ' jours';
}
function fmtDate(dateVal){
  var d = excelOrIsoDate(dateVal);
  return d ? d.toLocaleDateString('fr-FR') : '';
}
function esc(s){ return (s||'').toString().replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function domId(s){ return String(s||'').replace(/[^a-zA-Z0-9_-]/g,'_'); }
function attrSafe(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

var HS_ETAPE_LABEL = { reseau: 'Attente signature Directeur Réseau', rh1: 'Attente chiffrage RH', dir: 'Attente signature Direction' };
var AC_ETAPE_LABEL = { resp: 'Attente signature responsable', dir: 'Attente signature Direction', rh: 'Attente traitement RH' };
var MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function periodesDisponibles(){
  var parts = VAR_PERIODE_DEBUT.split('-');
  var d = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
  var now = new Date();
  var cur = new Date(now.getFullYear(), now.getMonth(), 1);
  var list = [];
  while (d <= cur){
    list.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
    d = new Date(d.getFullYear(), d.getMonth()+1, 1);
  }
  return list.reverse();
}
function libellePeriode(p){
  var parts = p.split('-');
  return MOIS_FR[Number(parts[1])-1] + ' ' + parts[0];
}

/* ============================ DONNEES ============================ */
var STATE = { cp: [], variables: null, samedis: [], hs: [], acompte: [] };
var VAR_PERIODE = null;

function togglePanel(id){
  document.getElementById(id).classList.toggle('expanded');
}

function renderCP(){
  var pending = STATE.cp;
  var filterEl = document.getElementById('cp-soc-filter');
  var currentVal = filterEl.value;
  var socsSeen = {};
  var socs = [];
  pending.forEach(function(d){
    var s = d.societe || '';
    if (s && !socsSeen[s]){ socsSeen[s] = true; socs.push(s); }
  });
  socs.sort();
  filterEl.innerHTML = '<option value="">Toutes les sociétés (' + pending.length + ')</option>' + socs.map(function(s){
    var cnt = pending.filter(function(d){ return d.societe === s; }).length;
    return '<option value="' + esc(s) + '">' + esc(s) + ' (' + cnt + ')</option>';
  }).join('');
  if (socs.indexOf(currentVal) !== -1) filterEl.value = currentVal;
  var activeSoc = filterEl.value;
  var filtered = activeSoc ? pending.filter(function(d){ return d.societe === activeSoc; }) : pending;

  var body = filtered.length ? '<div class="item-grid">' + filtered.map(function(d){
    var soc = esc(d.societe), who = esc(d.prenom) + ' ' + esc((d.nom||'').toUpperCase());
    var type = esc(d.type || 'CP');
    var dates = fmtDate(d.date_debut) + (d.date_fin && d.date_fin !== d.date_debut ? ' → ' + fmtDate(d.date_fin) : '');
    var attente = d.en_attente_nom ? 'En attente de ' + esc(d.en_attente_nom) : '';
    var relanceBtn = d.en_attente_email ? '<button type="button" class="relance" id="relance-cp-' + domId(d.id) + '" onclick="relancerCP(\'' + attrSafe(d.id) + '\')">✉️ Relancer</button>' : '';
    var deleteBtn = '<button type="button" class="delete" id="del-cp-' + domId(d.id) + '" onclick="supprimerCP(\'' + attrSafe(d.id) + '\')">🗑️ Supprimer</button>';
    return '<div class="item-card en_attente" id="card-cp-' + domId(d.id) + '"><div class="top"><span class="who">' + who + '</span><span class="tag en_attente">' + type + '</span></div>' +
      '<div class="meta">' + soc + ' — ' + dates + (attente ? '<br>' + attente : '') + '</div>' +
      '<div class="since">' + joursDepuis(d.date_derniere_action) + '</div>' +
      '<div class="btnrow">' + relanceBtn + deleteBtn + '</div></div>';
  }).join('') + '</div>' : '<div class="empty">Aucune demande' + (activeSoc ? ' pour ' + esc(activeSoc) : ' de CP ou d\'absence') + ' en attente.</div>';
  document.getElementById('sec-cp').querySelector('.panel-body').innerHTML = body;
  document.getElementById('cp-count').textContent = pending.length;
  document.getElementById('cp-count').className = 'n' + (pending.length===0 ? ' ok' : '');
  document.getElementById('cp-preview').innerHTML = previewHtml(pending.map(function(d){
    return esc(d.prenom) + ' ' + esc((d.nom||'').charAt(0).toUpperCase()) + '. — ' + esc(d.societe);
  }));
}

function renderVariables(){
  var info = STATE.variables;
  var box = document.getElementById('sec-var').querySelector('.panel-body');
  var countEl = document.getElementById('var-count');
  if (!info){ box.innerHTML = '<div class="empty">Chargement…</div>'; countEl.textContent = '…'; return; }
  var pending = info.magasins.filter(function(m){ return m.statut !== 'complet'; });
  var total = info.magasins.length;
  countEl.textContent = (total - pending.length) + '/' + total;
  countEl.className = 'n' + (pending.length===0 ? ' ok' : '');
  var body = pending.length ? '<div class="var-grid">' + pending.map(function(m){
    var tagCls = m.statut === 'non_envoye' ? 'non_envoye' : 'incomplet';
    var tagTxt = m.statut === 'non_envoye' ? 'Non envoyée' : 'Incomplète';
    var sig = m.statut === 'incomplet' ? '<div class="sig">' + m.signatures_ok + ' / ' + m.total_salaries + ' signés</div>' : '';
    var portalUrl = VAR_PORTAL_BASE + '?mag=' + encodeURIComponent(m.code);
    var pinTxt = PIN_CACHE.hasOwnProperty(m.code) ? (PIN_CACHE[m.code] || '—') : '…';
    return '<div class="var-card ' + tagCls + '"><div class="code">' + esc(m.code) + '</div>' +
      '<div class="dir">' + esc(m.directeur) + '</div>' +
      '<span class="badge">' + tagTxt + '</span>' + sig +
      '<button type="button" onclick="finaliserVariable(\'' + esc(m.code) + '\')">Marquer finalisée</button>' +
      '<button type="button" class="relance" id="relance-' + esc(m.code) + '" onclick="relancerVariable(\'' + esc(m.code) + '\',\'' + tagCls + '\',' + (m.signatures_ok||0) + ',' + (m.total_salaries||0) + ')">✉️ Relancer</button>' +
      '<div class="portal"><a href="' + esc(portalUrl) + '" target="_blank" rel="noopener">Ouvrir le portail ↗</a>' +
      '<div class="pin" id="pin-' + esc(m.code) + '">Code : <b>' + esc(pinTxt) + '</b></div></div>' +
      '</div>';
  }).join('') + '</div>' : '<div class="empty">Tous les magasins sont à jour pour ' + libellePeriode(info.periode) + '.</div>';
  box.innerHTML = body;
  loadPinsFor(pending.map(function(m){ return m.code; }));
  document.getElementById('var-preview').innerHTML = previewHtml(pending.map(function(m){
    var t = m.statut === 'non_envoye' ? 'Non envoyée' : ('Incomplète ' + (m.signatures_ok||0) + '/' + (m.total_salaries||0));
    return esc(m.code) + ' — ' + t;
  }));
}

function loadPinsFor(codes){
  codes.forEach(function(code){
    if (PIN_CACHE.hasOwnProperty(code)) return;
    fetch(VAR_DATA_BASE + encodeURIComponent(code) + '.json', {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        PIN_CACHE[code] = d && d.pin ? String(d.pin) : null;
        var el = document.getElementById('pin-' + code);
        if (el) el.innerHTML = 'Code : <b>' + esc(PIN_CACHE[code] || '—') + '</b>';
      })
      .catch(function(){
        PIN_CACHE[code] = null;
        var el = document.getElementById('pin-' + code);
        if (el) el.innerHTML = 'Code : <b>—</b>';
      });
  });
}

function fetchVariables(periode){
  return fetch(N8N_VARIABLES + '?periode=' + encodeURIComponent(periode))
    .then(function(r){ return r.json(); })
    .catch(function(){ return null; })
    .then(function(data){
      STATE.variables = data && data.magasins ? data : null;
      renderVariables();
    });
}
function onVarPeriodeChange(){
  VAR_PERIODE = document.getElementById('var-periode-select').value;
  document.getElementById('sec-var').querySelector('.panel-body').innerHTML = '<div class="empty">Chargement…</div>';
  fetchVariables(VAR_PERIODE);
}
function finaliserVariable(code){
  if (!confirm('Marquer ' + code + ' comme finalisée pour ' + libellePeriode(VAR_PERIODE) + ', même sans toutes les signatures ?')) return;
  var commentaire = prompt('Commentaire (optionnel) :', '') || '';
  fetch(N8N_VAR_FINALIZE, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ magasin_code: code, periode: VAR_PERIODE, finalise: true, finalise_par: 'RH', commentaire: commentaire })
  }).then(function(){ fetchVariables(VAR_PERIODE); })
    .catch(function(){ alert('Erreur lors de la finalisation — réessayez.'); });
}

function relancerVariable(code, statut, signaturesOk, totalSalaries){
  var parts = (VAR_PERIODE || '').split('-');
  var annee = Number(parts[0]) || new Date().getFullYear();
  var moisTxt = MOIS_FR[Number(parts[1]) - 1] || '';
  if (!confirm('Envoyer un e-mail de rappel au directeur de ' + code + ' pour ' + libellePeriode(VAR_PERIODE) + ' ?')) return;
  var btn = document.getElementById('relance-' + code);
  if (btn){ btn.disabled = true; btn.textContent = 'Envoi…'; }
  fetch(N8N_VAR_RELANCE, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      code: code, magasin_nom: code, periode: VAR_PERIODE, moisTxt: moisTxt, annee: annee,
      statut: statut, signatures_ok: signaturesOk, total_salaries: totalSalaries
    })
  }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(data){ return {ok:r.ok, data:data}; }); })
    .then(function(res){
      if (res.ok && res.data && res.data.ok){
        if (btn){ btn.textContent = '✔️ Envoyé'; }
        setTimeout(function(){ if (btn){ btn.disabled = false; btn.textContent = '✉️ Relancer'; } }, 4000);
      } else {
        alert((res.data && res.data.error) || "Erreur lors de l'envoi de la relance — réessayez.");
        if (btn){ btn.disabled = false; btn.textContent = '✉️ Relancer'; }
      }
    })
    .catch(function(){
      alert("Erreur lors de l'envoi de la relance — réessayez.");
      if (btn){ btn.disabled = false; btn.textContent = '✉️ Relancer'; }
    });
}

function relancerCP(id){
  var d = STATE.cp.filter(function(x){ return x.id === id; })[0];
  if (!d){ alert("Demande introuvable — actualisez le tableau et réessayez."); return; }
  if (!confirm('Envoyer un e-mail de rappel à ' + (d.en_attente_nom || 'la personne en attente') + ' pour la demande de ' + (d.prenom||'') + ' ' + (d.nom||'') + ' ?')) return;
  var btn = document.getElementById('relance-cp-' + domId(id));
  if (btn){ btn.disabled = true; btn.textContent = 'Envoi…'; }
  fetch(N8N_CP_RELANCE, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      id: d.id, societe: d.societe, nom: d.nom, prenom: d.prenom, type: d.type,
      date_debut: d.date_debut, date_fin: d.date_fin, etape: d.etape,
      en_attente_nom: d.en_attente_nom, en_attente_email: d.en_attente_email,
      lien: d.lien, date_derniere_action: d.date_derniere_action
    })
  }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(data){ return {ok:r.ok, data:data}; }); })
    .then(function(res){
      if (res.ok && res.data && res.data.ok){
        if (btn){ btn.textContent = '✔️ Envoyé'; }
        setTimeout(function(){ if (btn){ btn.disabled = false; btn.textContent = '✉️ Relancer'; } }, 4000);
      } else {
        alert((res.data && res.data.error) || "Erreur lors de l'envoi de la relance — réessayez.");
        if (btn){ btn.disabled = false; btn.textContent = '✉️ Relancer'; }
      }
    })
    .catch(function(){
      alert("Erreur lors de l'envoi de la relance — réessayez.");
      if (btn){ btn.disabled = false; btn.textContent = '✉️ Relancer'; }
    });
}

function supprimerCP(id){
  var d = STATE.cp.filter(function(x){ return x.id === id; })[0];
  if (!d){ alert("Demande introuvable — actualisez le tableau et réessayez."); return; }
  var who = (d.prenom||'') + ' ' + (d.nom||'').toUpperCase();
  var dateTxt = fmtDate(d.date_debut).split(' ')[0];
  if (!confirm('Supprimer définitivement la demande de ' + who + ' (' + (d.societe||'') + ', ' + dateTxt + ') ?\n\nCette action retire la demande du fichier Excel de suivi. Elle ne pourra pas être récupérée automatiquement.')) return;
  var btn = document.getElementById('del-cp-' + domId(id));
  if (btn){ btn.disabled = true; btn.textContent = 'Suppression…'; }
  fetch(N8N_CP_SUPPRIMER, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ id: d.id })
  }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(data){ return {ok:r.ok, data:data}; }); })
    .then(function(res){
      if (res.ok && res.data && res.data.ok){
        STATE.cp = STATE.cp.filter(function(x){ return x.id !== id; });
        renderCP();
      } else {
        alert((res.data && res.data.error) || "Erreur lors de la suppression — réessayez.");
        if (btn){ btn.disabled = false; btn.textContent = '🗑️ Supprimer'; }
      }
    })
    .catch(function(){
      alert("Erreur lors de la suppression — réessayez.");
      if (btn){ btn.disabled = false; btn.textContent = '🗑️ Supprimer'; }
    });
}

function renderSamedis(){
  var pending = STATE.samedis;
  var body = pending.length ? '<div class="item-grid">' + pending.map(function(s){
    var who = esc(s.prenom) + ' ' + esc((s.nom||'').toUpperCase());
    return '<div class="item-card reseau"><div class="top"><span class="who">' + who + '</span><span class="tag reseau">En attente</span></div>' +
      '<div class="meta">' + esc(s.societe) + ' — samedi du ' + fmtDate(s.date_samedi || s.date) + '</div></div>';
  }).join('') + '</div>' : '<div class="empty">Aucun samedi tournant en attente.</div>';
  document.getElementById('sec-samedi').querySelector('.panel-body').innerHTML = body;
  document.getElementById('samedi-count').textContent = pending.length;
  document.getElementById('samedi-count').className = 'n' + (pending.length===0 ? ' ok' : '');
  document.getElementById('samedi-preview').innerHTML = previewHtml(pending.map(function(s){
    return esc(s.prenom) + ' ' + esc((s.nom||'').charAt(0).toUpperCase()) + '. — ' + esc(s.societe);
  }));
}

function renderHsAc(){
  var hs = STATE.hs.map(function(r){
    return { who: esc(r.prenom) + ' ' + esc((r.nom||'').toUpperCase()), soc: esc(r.societe), tag: r.etape,
      label: HS_ETAPE_LABEL[r.etape] || r.etape, type: 'Heures sup', maj: r.date_maj };
  });
  var ac = STATE.acompte.map(function(r){
    return { who: esc(r.nom), soc: esc(r.societe), tag: r.etape,
      label: AC_ETAPE_LABEL[r.etape] || r.etape, type: 'Acompte' + (r.montant ? ' (' + esc(r.montant) + ' €)' : ''), maj: r.date_maj };
  });
  var all = hs.concat(ac);
  var body = all.length ? '<div class="item-grid">' + all.map(function(r){
    return '<div class="item-card ' + r.tag + '"><div class="top"><span class="who">' + r.who + '</span><span class="tag ' + r.tag + '">' + esc(r.type) + '</span></div>' +
      '<div class="meta">' + r.soc + ' — ' + esc(r.label) + '</div>' +
      '<div class="since">' + joursDepuis(r.maj) + '</div></div>';
  }).join('') + '</div>' : '<div class="empty">Aucune demande d\'heures sup ou d\'acompte en attente.</div>';
  document.getElementById('sec-hsac').querySelector('.panel-body').innerHTML = body;
  document.getElementById('hsac-count').textContent = all.length;
  document.getElementById('hsac-count').className = 'n' + (all.length===0 ? ' ok' : '');
  document.getElementById('hsac-preview').innerHTML = previewHtml(all.map(function(r){
    return r.who + ' — ' + esc(r.type);
  }));
}

function buildPanels(){
  document.getElementById('panels').innerHTML =
    '<div class="panel" id="sec-cp" style="--pc:#E67E22">' +
      '<div class="panel-face" onclick="togglePanel(\'sec-cp\')"><div><div class="n" id="cp-count">0</div><div class="l">CP / absences en attente</div></div><div class="chev">▾</div></div>' +
      '<div class="panel-preview" id="cp-preview" onclick="togglePanel(\'sec-cp\')"></div>' +
      '<div class="panel-detail">' +
        '<div class="panel-toolbar"><select id="cp-soc-filter" onchange="renderCP()"><option value="">Toutes les sociétés</option></select></div>' +
        '<div class="panel-body"></div>' +
      '</div>' +
    '</div>' +
    '<div class="panel" id="sec-var" style="--pc:#2980B9">' +
      '<div class="panel-face" onclick="togglePanel(\'sec-var\')"><div><div class="n" id="var-count">…</div><div class="l">Magasins variables paie à jour</div></div><div class="chev">▾</div></div>' +
      '<div class="panel-preview" id="var-preview" onclick="togglePanel(\'sec-var\')"></div>' +
      '<div class="panel-detail">' +
        '<div class="panel-toolbar"><span class="tb-label">Période :</span><select id="var-periode-select" onchange="onVarPeriodeChange()"></select></div>' +
        '<div class="panel-note" id="var-note">Astuce : utilisez « Marquer finalisée » si une signature manquante ne viendra jamais.</div>' +
        '<div class="panel-body"></div>' +
      '</div>' +
    '</div>' +
    '<div class="panel" id="sec-samedi" style="--pc:#8E44AD">' +
      '<div class="panel-face" onclick="togglePanel(\'sec-samedi\')"><div><div class="n" id="samedi-count">0</div><div class="l">Samedis tournants en attente (Edgard)</div></div><div class="chev">▾</div></div>' +
      '<div class="panel-preview" id="samedi-preview" onclick="togglePanel(\'sec-samedi\')"></div>' +
      '<div class="panel-detail"><div class="panel-body"></div></div>' +
    '</div>' +
    '<div class="panel" id="sec-hsac" style="--pc:#C9A84C">' +
      '<div class="panel-face" onclick="togglePanel(\'sec-hsac\')"><div><div class="n" id="hsac-count">0</div><div class="l">Heures sup / acomptes en attente</div></div><div class="chev">▾</div></div>' +
      '<div class="panel-preview" id="hsac-preview" onclick="togglePanel(\'sec-hsac\')"></div>' +
      '<div class="panel-detail"><div class="panel-body"></div></div>' +
    '</div>';
}

function previewHtml(lines){
  if (!lines.length) return '<div class="pv-item" style="color:#bbb">Rien en attente</div>';
  var shown = lines.slice(0, 2).map(function(t){ return '<div class="pv-item">' + t + '</div>'; }).join('');
  var more = lines.length > 2 ? '<div class="pv-more">+ ' + (lines.length - 2) + ' autre' + (lines.length - 2 > 1 ? 's' : '') + '</div>' : '';
  return shown + more;
}

function loadAll(){
  document.getElementById('lastUpdate').textContent = 'Chargement...';
  buildPanels();

  var periodes = periodesDisponibles();
  var sel = document.getElementById('var-periode-select');
  sel.innerHTML = periodes.map(function(p){ return '<option value="' + p + '">' + libellePeriode(p) + '</option>'; }).join('');
  if (!VAR_PERIODE || periodes.indexOf(VAR_PERIODE) === -1) VAR_PERIODE = periodes[0];
  sel.value = VAR_PERIODE;

  var pCP = fetch(N8N_DEMANDES).then(function(r){ return r.json(); }).catch(function(){ return { data: [], archive: [] }; });
  var pSam = fetch(N8N_SAMEDIS).then(function(r){ return r.json(); }).catch(function(){ return { data: [] }; });
  var pHS = fetch(N8N_HS).then(function(r){ return r.json(); }).catch(function(){ return { data: [] }; });
  var pAC = fetch(N8N_ACOMPTE).then(function(r){ return r.json(); }).catch(function(){ return { data: [] }; });
  var pVar = fetchVariables(VAR_PERIODE);

  Promise.all([pCP, pSam, pHS, pAC, pVar]).then(function(results){
    var demandesRaw = Array.isArray(results[0]) ? results[0] : (results[0].data || []);
    var archiveRaw  = Array.isArray(results[0]) ? [] : (results[0].archive || []);
    var demandes = dedupeLatest(demandesRaw.concat(archiveRaw));
    STATE.cp = demandes.filter(function(d){ return d.statut === 'en_attente'; });

    var samRaw = Array.isArray(results[1]) ? results[1] : (results[1].data || []);
    STATE.samedis = samRaw.filter(function(s){ return s.statut === 'en_attente'; });

    STATE.hs = (results[2] && results[2].data) || [];
    STATE.acompte = (results[3] && results[3].data) || [];

    renderCP();
    renderSamedis();
    renderHsAc();

    document.getElementById('lastUpdate').textContent = 'Mis à jour le ' + new Date().toLocaleString('fr-FR');
  }).catch(function(e){
    document.getElementById('lastUpdate').textContent = 'Erreur de chargement — réessayez plus tard';
    console.error(e);
  });
}
