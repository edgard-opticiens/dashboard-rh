var STATS_MAG = {
  EDGARD: ['ANGO','BIARRO','BORDO','CAENPO','GIRO','HAVRO','JISAM','LYONO','MANSO','MARSEILLO','NANCEO','NANTO','NICEO','ORLO','REIMO','STRABO','TURO'],
  GDO: ['CHATO','CHEMILLO','CHOLO','DUNES','ECUME','FORMIO','MARAIS','MUDO','NIORTO']
};
function statsLoad(){
  return authRead('stats', {days: 190}).then(function(j){
    return { ok: !!(j && j.ok), rows: (j && j.rows) || [] };
  }).catch(function(){ return { ok: false, rows: [] }; });
}
function statsDayKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function statsFmtDay(k){ var p = k.split('-'); return p[2] + '/' + p[1]; }
function statsNice(max){
  var steps = [1,2,5,10,20,50,100,200,500,1000,2000,5000];
  for (var i = 0; i < steps.length; i++){ if (steps[i] * 4 >= max) return steps[i] * 4; }
  return Math.ceil(max / 4) * 4;
}
function statsDelta(cur, prev){
  if (!prev) return cur ? 'période précédente : 0' : '';
  var pct = Math.round((cur - prev) / prev * 100);
  return (pct >= 0 ? '▲ +' : '▼ ') + pct + ' % <span>vs période précédente (' + prev + ')</span>';
}
function statsHBars(entries, max){
  if (!entries.length) return '<div class="st-empty">Aucune donnée sur la période.</div>';
  return entries.map(function(e){
    var w = max ? Math.max(1, Math.round(e[1] / max * 100)) : 0;
    return '<div class="st-hbar"><span class="lb" title="' + esc(e[0]).replace(/"/g,'&quot;') + '">' + esc(e[0]) + '</span><span class="tr"><span class="fi" style="display:block;width:' + w + '%"></span></span><span class="nv">' + e[1] + '</span></div>';
  }).join('');
}
function statsDailyChart(days, vals){
  var bw0 = (document.getElementById('stats-body') || {}).clientWidth || 700;
  var W = Math.max(300, Math.min(700, bw0 - 34)), H = 190, L = 34, R = 8, T = 10, B = 24;
  var pw = W - L - R, ph = H - T - B;
  var max = statsNice(Math.max.apply(null, vals.concat([1])));
  var n = days.length, slot = pw / n, gap = n > 45 ? 1 : 2, bw = Math.max(1, slot - gap);
  var g = '';
  for (var i = 0; i <= 4; i++){
    var y = T + ph - ph * i / 4, v = Math.round(max * i / 4);
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="#EFE7D6" stroke-width="1"/>' +
         '<text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10.5" fill="#78705F">' + v + '</text>';
  }
  var bars = '', hits = '';
  for (var d = 0; d < n; d++){
    var h = vals[d] / max * ph, x = L + d * slot + gap / 2;
    if (vals[d] > 0) bars += '<path d="M' + x + ' ' + (T + ph) + 'V' + (T + ph - h + 2) + 'Q' + x + ' ' + (T + ph - h) + ' ' + (x + 2) + ' ' + (T + ph - h) + 'H' + (x + bw - 2) + 'Q' + (x + bw) + ' ' + (T + ph - h) + ' ' + (x + bw) + ' ' + (T + ph - h + 2) + 'V' + (T + ph) + 'Z" fill="#A97A2E"/>';
    hits += '<rect class="st-hit" data-i="' + d + '" x="' + (L + d * slot) + '" y="' + T + '" width="' + slot + '" height="' + ph + '" fill="transparent"/>';
  }
  var step = n <= 7 ? 1 : n <= 31 ? 5 : 15, xl = '';
  for (var k = 0; k < n; k += step){
    xl += '<text x="' + (L + k * slot + slot / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10.5" fill="#78705F">' + statsFmtDay(days[k]) + '</text>';
  }
  xl += '<text x="' + (L + (n - 1) * slot + slot / 2) + '" y="' + (H - 6) + '" text-anchor="end" font-size="10.5" fill="#78705F"></text>';
  return '<div class="st-chart" id="st-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Visites par jour">' + g +
         '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '" stroke="#CFC5AE" stroke-width="1"/>' + bars + xl + hits + '</svg><div class="st-tip" id="st-tip"></div></div>';
}
function statsBindTip(days, vals){
  var box = document.getElementById('st-chart'); if (!box) return;
  var tip = document.getElementById('st-tip');
  var JOURS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
  box.querySelectorAll('.st-hit').forEach(function(el){
    function show(ev){
      var i = +el.getAttribute('data-i'), p = days[i].split('-'), dt = new Date(+p[0], +p[1]-1, +p[2]);
      tip.innerHTML = JOURS[dt.getDay()] + ' ' + statsFmtDay(days[i]) + ' — <b>' + vals[i] + '</b> visite' + (vals[i] > 1 ? 's' : '');
      var r = box.getBoundingClientRect(), rr = el.getBoundingClientRect();
      tip.style.left = (rr.left - r.left + rr.width / 2) + 'px';
      tip.style.top = (ev.clientY - r.top) + 'px';
      tip.style.display = 'block';
    }
    el.addEventListener('mousemove', show); el.addEventListener('click', show);
    el.addEventListener('mouseleave', function(){ tip.style.display = 'none'; });
  });
}
function renderStats(){
  var body = document.getElementById('stats-body'); if (!body) return;
  var fp = (document.getElementById('stats-portail') || {}).value || '';
  var per = +((document.getElementById('stats-periode') || {}).value || 30);
  var S = STATE.pstats || { ok: false, rows: [] };
  var today = new Date(); today.setHours(0,0,0,0);
  function dkey(off){ var d = new Date(today); d.setDate(d.getDate() - off); return statsDayKey(d); }
  var from = dkey(per - 1), prevFrom = dkey(2 * per - 1), prevTo = dkey(per);
  var rows = S.rows.filter(function(r){ return !fp || r.p === fp; });
  var cur = rows.filter(function(r){ return r.j >= from; });
  var prev = rows.filter(function(r){ return r.j >= prevFrom && r.j <= prevTo; });
  function sum(list, t){ return list.reduce(function(s, r){ return s + (r.t === t ? r.n : 0); }, 0); }
  // compteur de la face (30 jours, tous portails)
  var from30 = dkey(29), all30 = S.rows.filter(function(r){ return r.j >= from30; });
  var v30 = sum(all30, 'visite'), c30 = sum(all30, 'clic'), d30 = sum(all30, 'dir');
  var cnt = document.getElementById('stats-count'); if (cnt) cnt.textContent = S.ok ? v30 : '–';
  var prv = document.getElementById('stats-preview');
  if (prv) prv.innerHTML = S.ok ? (v30 + c30 + d30 ? '<span>' + c30 + ' clics sur les outils · ' + d30 + ' connexions directeur</span>' : '<span>En attente des premières données</span>') : '<span>Statistiques indisponibles</span>';
  if (!S.ok){ body.innerHTML = '<div class="st-empty">Impossible de charger les statistiques pour le moment.</div>'; return; }
  if (!S.rows.length){ body.innerHTML = '<div class="st-empty">Aucune donnée pour l\'instant. Les statistiques se rempliront dès que le portail mis à jour sera en ligne et visité.</div>'; return; }

  var vis = sum(cur, 'visite'), clk = sum(cur, 'clic'), dir = sum(cur, 'dir');
  var visP = sum(prev, 'visite'), clkP = sum(prev, 'clic'), dirP = sum(prev, 'dir');
  var split = '';
  if (!fp){ split = 'Edgard ' + sum(cur.filter(function(r){ return r.p === 'EDGARD'; }), 'visite') + ' · GdO ' + sum(cur.filter(function(r){ return r.p === 'GDO'; }), 'visite'); }
  var kpis = '<div class="st-kpis">' +
    '<div class="st-kpi"><div class="v">' + vis + '</div><div class="k">Visites</div><div class="d">' + (split ? '<b>' + split + '</b><br>' : '') + statsDelta(vis, visP) + '</div></div>' +
    '<div class="st-kpi"><div class="v">' + clk + '</div><div class="k">Clics sur les outils</div><div class="d">' + statsDelta(clk, clkP) + '</div></div>' +
    '<div class="st-kpi"><div class="v">' + dir + '</div><div class="k">Connexions à l\'espace directeur</div><div class="d">' + statsDelta(dir, dirP) + '</div></div></div>';

  // visites par jour
  var days = [], idx = {};
  for (var i = per - 1; i >= 0; i--){ var k = dkey(i); idx[k] = days.length; days.push(k); }
  var vals = days.map(function(){ return 0; });
  cur.forEach(function(r){ if (r.t === 'visite' && idx[r.j] != null) vals[idx[r.j]] += r.n; });
  var daily = '<div class="st-card wide"><h4>Visites par jour</h4><div class="sub">' + statsFmtDay(days[0]) + ' → ' + statsFmtDay(days[days.length-1]) + ' · une visite = une ouverture du portail par session</div>' + statsDailyChart(days, vals) + '</div>';

  // outils
  var tools = {}; cur.forEach(function(r){ if (r.t === 'clic' && r.c) tools[r.c] = (tools[r.c] || 0) + r.n; });
  var tl = Object.keys(tools).map(function(k){ return [k, tools[k]]; }).sort(function(a,b){ return b[1] - a[1]; }).slice(0, 10);
  var toolsCard = '<div class="st-card"><h4>Outils les plus utilisés</h4><div class="sub">Clics sur les cartes du portail (top 10)</div>' + statsHBars(tl, tl.length ? tl[0][1] : 0) + '</div>';

  // magasins
  var mags = {}; cur.forEach(function(r){ if (r.t === 'dir' && r.m) mags[r.m] = (mags[r.m] || 0) + r.n; });
  var ml = Object.keys(mags).map(function(k){ return [k, mags[k]]; }).sort(function(a,b){ return b[1] - a[1]; }).slice(0, 12);
  var pool = fp ? STATS_MAG[fp] : STATS_MAG.EDGARD.concat(STATS_MAG.GDO);
  var zero = pool.filter(function(m){ return !mags[m]; });
  var magCard = '<div class="st-card"><h4>Connexions directeur par magasin</h4><div class="sub">Ouvertures de l\'espace directeur (une par visite)</div>' + statsHBars(ml, ml.length ? ml[0][1] : 0) +
    '<div class="st-zero"><b>Sans connexion sur la période (' + zero.length + '/' + pool.length + ') :</b> ' + (zero.length ? esc(zero.map(function(m){ return m.charAt(0) + m.slice(1).toLowerCase(); }).join(', ')) : 'aucun, tous les magasins se sont connectés') + '</div></div>';

  // appareils
  var mob = 0, ord = 0; cur.forEach(function(r){ if (r.t === 'visite'){ if (r.a === 'mobile') mob += r.n; else ord += r.n; } });
  var tot = mob + ord;
  var devCard = '<div class="st-card wide"><h4>Appareils</h4><div class="sub">Répartition des visites</div>' +
    (tot ? '<div class="st-dev" role="img" aria-label="Répartition mobile et ordinateur">' + (mob ? '<i style="background:#D6602F;width:' + (mob / tot * 100) + '%" title="Mobile : ' + mob + '"></i>' : '') + (ord ? '<i style="background:#1C1710;width:' + (ord / tot * 100) + '%" title="Ordinateur : ' + ord + '"></i>' : '') + '</div>' +
      '<div class="st-leg"><span><span class="sw" style="background:#D6602F"></span>Mobile — <b>' + Math.round(mob / tot * 100) + ' %</b> (' + mob + ')</span><span><span class="sw" style="background:#1C1710"></span>Ordinateur — <b>' + Math.round(ord / tot * 100) + ' %</b> (' + ord + ')</span></div>' : '<div class="st-empty">Aucune visite sur la période.</div>') + '</div>';

  body.innerHTML = kpis + '<div class="st-grid">' + daily + toolsCard + magCard + devCard + '</div>';
  statsBindTip(days, vals);
}

function loadAll(){
  document.getElementById('lastUpdate').textContent = 'Chargement...';
  buildPanels();

  var periodes = periodesDisponibles();
  var sel = document.getElementById('var-periode-select');
  sel.innerHTML = periodes.map(function(p){ return '<option value="' + p + '">' + libellePeriode(p) + '</option>'; }).join('');
  if (!VAR_PERIODE || periodes.indexOf(VAR_PERIODE) === -1) VAR_PERIODE = periodes[0];
  sel.value = VAR_PERIODE;

  var pCP = authRead('demandes').catch(function(){ return { data: [], archive: [] }; });
  var pHS = authRead('hs').catch(function(){ return { data: [] }; });
  var pAC = authRead('acompte').catch(function(){ return { data: [] }; });
  var pNDF = authRead('ndf').catch(function(){ return { data: [] }; });
  var pSoldes = authRead('soldes').catch(function(){ return { tout: {} }; });
  var pPlannings = authRead('plannings').catch(function(){ return { plannings: [], magasinsManquants: [] }; });
  var pVar = fetchVariables(VAR_PERIODE);
  var pEdevManuel = edevLoadManual();
  var pDirs = dirsLoad();
  var pMotifs = absMotifsLoad();
  var pStats = statsLoad();

  Promise.all([pCP, pHS, pAC, pSoldes, pPlannings, pVar, pEdevManuel, pDirs, pMotifs, pStats, pNDF]).then(function(results){
    var demandesRaw = Array.isArray(results[0]) ? results[0] : (results[0].data || []);
    var archiveRaw  = Array.isArray(results[0]) ? [] : (results[0].archive || []);
    var demandes = dedupeLatest(demandesRaw.concat(archiveRaw));
    STATE.cp = demandes.filter(function(d){ return d.statut === 'en_attente'; });
    STATE.cpHistorique = demandes.filter(function(d){ return d.statut === 'valide'; })
      .sort(function(a,b){ return new Date(b.date_derniere_action) - new Date(a.date_derniere_action); });

    if (results[7] && results[7].length) STATE.dirs = results[7];
    dirsBuildAbs(demandes);
    STATE.edevBase = demandes
      .filter(function(d){ return normalizeNom(d.societe).indexOf('EDGARDDEVELOPPEMENT') !== -1; })
      .filter(function(d){ return ['valide','en_attente','telecharge','attente_telechargement'].indexOf(d.statut) !== -1; })
      .map(function(d){
        var debut = edevDay(d.date_debut);
        return { rid: d.id, lien: d.lien || '', nom: d.nom, prenom: d.prenom, type: d.type, statut: d.statut, debut: debut, fin: edevDay(d.date_fin) || debut };
      })
      .filter(function(c){ return c.debut; });
    edevRebuild();

    STATE.hs = (results[1] && results[1].data) || [];
    STATE.acompte = (results[2] && results[2].data) || [];
    STATE.ndf = (results[10] && results[10].data) || [];

    var soldesParsed = buildSoldesFlat((results[3] && results[3].tout) || {}, (results[3] && results[3].futuresCP) || {});
    STATE.soldes = soldesParsed.list;
    STATE.soldesArretes = soldesParsed.arretes;
    STATE.soldesMois = soldesParsed.mois;

    STATE.plannings = (results[4] && results[4].plannings) || [];
    STATE.planningsManquants = (results[4] && results[4].magasinsManquants) || [];

    renderCP();
    renderHsAc();
    renderSoldes();
    renderPlannings();
    renderEdev();
    renderDirs();
    STATE.pstats = results[9] || { ok: false, rows: [] };
    renderStats();
    Promise.all([edevEnrich(), dirsEnrich()]).then(function(){ absRebuildAll(); absRenderAll(); });

    document.getElementById('lastUpdate').textContent = 'Mis à jour le ' + new Date().toLocaleString('fr-FR');
  }).catch(function(e){
    document.getElementById('lastUpdate').textContent = 'Erreur de chargement — réessayez plus tard';
    console.error(e);
  });
}
