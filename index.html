<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tableau de bord RH — Groupe Edgard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#C9A84C;--dk:#1A1A1A;--md:#666;--lt:#F9F7F2;--bd:#E0DCD0;--green:#27AE60;--orange:#E67E22;--red:#C0392B;--blue:#2980B9;--purple:#8E44AD}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F2EFE8;min-height:100vh;padding:20px 14px 60px;color:var(--dk)}

#gate{position:fixed;inset:0;background:#F2EFE8;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);max-width:360px;width:100%;padding:30px 26px;text-align:center}
.gate-box h2{font-family:'Playfair Display',serif;font-size:19px;margin-bottom:4px}
.gate-box p{font-size:12.5px;color:#666;margin-bottom:18px}
.gate-box input{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:6px;margin-bottom:10px;font-size:15px;font-family:'DM Sans',sans-serif;text-align:center;letter-spacing:.2em}
.gate-box button{width:100%;padding:11px;background:var(--dk);color:#fff;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer}
#gateErr{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}

#app{display:none}

.hdr{max-width:1200px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.hdr h1{font-family:'Playfair Display',serif;font-size:22px;color:var(--dk)}
.hdr .sub{font-size:12px;color:var(--md);margin-top:2px}
.refresh{background:var(--dk);color:#fff;border:none;padding:9px 18px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.refresh:hover{background:#333}

.stats{max-width:1200px;margin:0 auto 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:#fff;border-radius:10px;padding:16px 18px;border-left:4px solid var(--g);box-shadow:0 2px 10px rgba(0,0,0,.05);cursor:pointer;transition:transform .12s}
.stat:hover{transform:translateY(-2px)}
.stat .n{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;line-height:1}
.stat .l{font-size:11px;color:var(--md);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
.stat.ok .n{color:var(--green)}

.sections{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.section{background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.06);overflow:hidden}
.section-hdr{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd);cursor:pointer}
.section-hdr h2{font-family:'Playfair Display',serif;font-size:16px}
.section-hdr .count{font-size:12px;color:#fff;background:var(--dk);padding:2px 10px;border-radius:20px;font-weight:600}
.section-hdr .count.zero{background:#B9E4C5;color:#1e7a45}
.section-hdr .chev{font-size:12px;color:var(--md);transition:transform .15s}
.section.collapsed .chev{transform:rotate(-90deg)}
.section.collapsed .section-body{display:none}
.section-body{padding:6px 20px 16px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F0EDE4;font-size:13px;flex-wrap:wrap}
.row:last-child{border-bottom:none}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding:3px 8px;border-radius:5px;flex:0 0 auto;white-space:nowrap}
.tag.en_attente,.tag.incomplet,.tag.reseau,.tag.dir,.tag.rh1,.tag.resp{background:#FDEBD8;color:#a3560f}
.tag.non_envoye{background:#FADBD8;color:#943126}
.tag.complet{background:#D5F5E3;color:#1e7a45}
.row .who{font-weight:700;flex:1 1 160px;min-width:0}
.row .meta{color:var(--md);font-size:12px;flex:2 1 220px}
.row .since{color:#999;font-size:11px;flex:0 0 auto;white-space:nowrap}
.empty{color:var(--md);font-size:12.5px;padding:14px 0;text-align:center}
.section-note{font-size:11px;color:#999;padding:0 20px 14px;margin-top:-6px}

.var-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:6px 0 12px}
.var-card{border-radius:10px;padding:14px 10px 12px;text-align:center;border:1.5px solid var(--bd);background:#FBFAF7}
.var-card .code{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;letter-spacing:.2px}
.var-card .dir{font-size:11px;color:var(--md);margin-top:3px;line-height:1.3;min-height:28px}
.var-card .badge{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:8px}
.var-card .sig{font-size:10px;color:var(--md);margin-top:4px}
.var-card.non_envoye{border-color:#F3C6B8;background:#FDF4F1}
.var-card.non_envoye .badge{background:#FADBD8;color:#943126}
.var-card.incomplet{border-color:#F6DCA8;background:#FEFAF0}
.var-card.incomplet .badge{background:#FDEBD8;color:#a3560f}

.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:6px 0 12px}
.item-card{border-radius:10px;padding:14px 16px;border:1.5px solid var(--bd);background:#FEFAF0;display:flex;flex-direction:column;gap:7px}
.item-card.non_envoye{border-color:#F3C6B8;background:#FDF4F1}
.item-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-card .who{font-weight:700;font-size:14px;line-height:1.3}
.item-card .tag{flex:0 0 auto}
.item-card .meta{color:var(--md);font-size:12px;line-height:1.4}
.item-card .since{color:#999;font-size:10.5px;margin-top:auto;padding-top:2px}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h2>Tableau de bord RH</h2>
    <p>Réservé au service RH — saisissez le code d'accès</p>
    <input type="password" id="gatePin" placeholder="Code d'accès" maxlength="12">
    <button type="button" onclick="tryGate()">Accéder</button>
    <div id="gateErr"></div>
  </div>
</div>

<div id="app">

<div class="hdr">
  <div>
    <h1>Tableau de bord RH — Groupe Edgard</h1>
    <div class="sub" id="lastUpdate">Chargement...</div>
  </div>
  <button class="refresh" onclick="loadAll()">↻ Actualiser</button>
</div>

<div class="stats" id="stats"></div>

<div class="sections" id="sections"></div>

</div>

<script>
/* ============================ CONFIG ============================ */
var RH_CODE = 'Edgard37*'; // code d'accès partagé service RH

var N8N_DEMANDES  = 'https://edgard-opticiens.app.n8n.cloud/webhook/get-demandes';
var N8N_VARIABLES = 'https://edgard-opticiens.app.n8n.cloud/webhook/get-variables-paie';
var N8N_SAMEDIS   = 'https://edgard-opticiens.app.n8n.cloud/webhook/get-samedis-tournant';
var N8N_HS        = 'https://edgard-opticiens.app.n8n.cloud/webhook/get-heures-sup';
var N8N_ACOMPTE   = 'https://edgard-opticiens.app.n8n.cloud/webhook/get-acompte';

function tryGate(){
  var pin = document.getElementById('gatePin').value.trim();
  var err = document.getElementById('gateErr');
  if (pin !== RH_CODE){ err.textContent = 'Code incorrect.'; document.getElementById('gatePin').value=''; return; }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAll();
  setInterval(loadAll, 300000);
}
document.getElementById('gatePin').addEventListener('keydown', function(e){ if(e.key==='Enter') tryGate(); });

/* ============================ HELPERS ============================ */
function excelOrIsoDate(v){
  if (v==='' || v===null || v===undefined) return null;
  if (typeof v==='number' || /^\d+(\.\d+)?$/.test(v)) return new Date((Number(v)-25569)*86400000);
  var d = new Date(v);
  return isNaN(d) ? null : d;
}
function dedupeLatest(arr){
  var byId = {};
  arr.forEach(function(d){
    var id = d.id;
    if (!id){ byId[Math.random()] = d; return; }
    if (!byId[id] || new Date(d.date_derniere_action) > new Date(byId[id].date_derniere_action)) byId[id] = d;
  });
  return Object.values(byId);
}
function joursDepuis(dateVal){
  var d = excelOrIsoDate(dateVal);
  if (!d) return '';
  var days = Math.floor((new Date() - d) / 86400000);
  if (days <= 0) return 'aujourd\'hui';
  if (days === 1) return 'depuis 1 jour';
  return 'depuis ' + days + ' jours';
}
function fmtDate(dateVal){
  var d = excelOrIsoDate(dateVal);
  return d ? d.toLocaleDateString('fr-FR') : '';
}
function esc(s){ return (s||'').toString().replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

var HS_ETAPE_LABEL = { reseau: 'Attente signature Directeur Réseau', rh1: 'Attente chiffrage RH', dir: 'Attente signature Direction' };
var AC_ETAPE_LABEL = { resp: 'Attente signature responsable', dir: 'Attente signature Direction', rh: 'Attente traitement RH' };

/* ============================ DONNEES ============================ */
var STATE = { cp: [], variables: null, samedis: [], hs: [], acompte: [] };

function toggleSection(id){
  var el = document.getElementById(id);
  el.classList.toggle('collapsed');
}

function renderStats(){
  var cpCount = STATE.cp.length;
  var varInfo = STATE.variables;
  var varPending = varInfo ? varInfo.magasins.filter(function(m){ return m.statut !== 'complet'; }).length : 0;
  var varTotal = varInfo ? varInfo.magasins.length : 0;
  var samediCount = STATE.samedis.length;
  var hsAcCount = STATE.hs.length + STATE.acompte.length;

  document.getElementById('stats').innerHTML =
    '<div class="stat" onclick="toggleSection(\'sec-cp\')" style="border-color:#E67E22"><div class="n">' + cpCount + '</div><div class="l">CP / absences en attente</div></div>' +
    '<div class="stat' + (varPending===0 && varInfo ? ' ok' : '') + '" onclick="toggleSection(\'sec-var\')" style="border-color:#2980B9"><div class="n">' + (varInfo ? (varTotal - varPending) + '/' + varTotal : '…') + '</div><div class="l">Magasins variables paie à jour</div></div>' +
    '<div class="stat" onclick="toggleSection(\'sec-samedi\')" style="border-color:#8E44AD"><div class="n">' + samediCount + '</div><div class="l">Samedis tournants en attente</div></div>' +
    '<div class="stat" onclick="toggleSection(\'sec-hsac\')" style="border-color:#C9A84C"><div class="n">' + hsAcCount + '</div><div class="l">Heures sup / acomptes en attente</div></div>';
}

function renderCP(){
  var pending = STATE.cp;
  var body = pending.length ? '<div class="item-grid">' + pending.map(function(d){
    var soc = esc(d.societe), who = esc(d.prenom) + ' ' + esc((d.nom||'').toUpperCase());
    var type = esc(d.type || 'CP');
    var dates = fmtDate(d.date_debut) + (d.date_fin && d.date_fin !== d.date_debut ? ' → ' + fmtDate(d.date_fin) : '');
    var attente = d.en_attente_nom ? 'En attente de ' + esc(d.en_attente_nom) : '';
    return '<div class="item-card en_attente"><div class="top"><span class="who">' + who + '</span><span class="tag en_attente">' + type + '</span></div>' +
      '<div class="meta">' + soc + ' — ' + dates + (attente ? '<br>' + attente : '') + '</div>' +
      '<div class="since">' + joursDepuis(d.date_derniere_action) + '</div></div>';
  }).join('') + '</div>' : '<div class="empty">Aucune demande de CP ou d\'absence en attente.</div>';
  document.getElementById('sec-cp').querySelector('.section-body').innerHTML = body;
  document.getElementById('cp-count').textContent = pending.length;
  document.getElementById('cp-count').className = 'count' + (pending.length===0 ? ' zero' : '');
}

function renderVariables(){
  var info = STATE.variables;
  var box = document.getElementById('sec-var').querySelector('.section-body');
  var countEl = document.getElementById('var-count');
  if (!info){ box.innerHTML = '<div class="empty">Chargement…</div>'; return; }
  var pending = info.magasins.filter(function(m){ return m.statut !== 'complet'; });
  countEl.textContent = pending.length;
  countEl.className = 'count' + (pending.length===0 ? ' zero' : '');
  var body = pending.length ? '<div class="var-grid">' + pending.map(function(m){
    var tagCls = m.statut === 'non_envoye' ? 'non_envoye' : 'incomplet';
    var tagTxt = m.statut === 'non_envoye' ? 'Non envoyée' : 'Incomplète';
    var sig = m.statut === 'incomplet' ? '<div class="sig">' + m.signatures_ok + ' / ' + m.total_salaries + ' signés</div>' : '';
    return '<div class="var-card ' + tagCls + '"><div class="code">' + esc(m.code) + '</div>' +
      '<div class="dir">' + esc(m.directeur) + '</div>' +
      '<span class="badge">' + tagTxt + '</span>' + sig + '</div>';
  }).join('') + '</div>' : '<div class="empty">Tous les magasins sont à jour pour ce mois.</div>';
  box.innerHTML = body;
  document.getElementById('var-note').textContent = 'Période ciblée : ' + info.moisTxt + ' ' + info.annee + ' (mois précédent, délai habituel de transmission).';
}

function renderSamedis(){
  var pending = STATE.samedis;
  var body = pending.length ? '<div class="item-grid">' + pending.map(function(s){
    var who = esc(s.prenom) + ' ' + esc((s.nom||'').toUpperCase());
    return '<div class="item-card reseau"><div class="top"><span class="who">' + who + '</span><span class="tag reseau">En attente</span></div>' +
      '<div class="meta">' + esc(s.societe) + ' — samedi du ' + fmtDate(s.date_samedi || s.date) + '</div></div>';
  }).join('') + '</div>' : '<div class="empty">Aucun samedi tournant en attente.</div>';
  document.getElementById('sec-samedi').querySelector('.section-body').innerHTML = body;
  document.getElementById('samedi-count').textContent = pending.length;
  document.getElementById('samedi-count').className = 'count' + (pending.length===0 ? ' zero' : '');
}

function renderHsAc(){
  var hs = STATE.hs.map(function(r){
    return { who: esc(r.prenom) + ' ' + esc((r.nom||'').toUpperCase()), soc: esc(r.societe), tag: r.etape,
      label: HS_ETAPE_LABEL[r.etape] || r.etape, type: 'Heures sup', maj: r.date_maj };
  });
  var ac = STATE.acompte.map(function(r){
    return { who: esc(r.nom), soc: esc(r.societe), tag: r.etape,
      label: AC_ETAPE_LABEL[r.etape] || r.etape, type: 'Acompte' + (r.montant ? ' (' + esc(r.montant) + ' €)' : ''), maj: r.date_maj };
  });
  var all = hs.concat(ac);
  var body = all.length ? '<div class="item-grid">' + all.map(function(r){
    return '<div class="item-card ' + r.tag + '"><div class="top"><span class="who">' + r.who + '</span><span class="tag ' + r.tag + '">' + esc(r.type) + '</span></div>' +
      '<div class="meta">' + r.soc + ' — ' + esc(r.label) + '</div>' +
      '<div class="since">' + joursDepuis(r.maj) + '</div></div>';
  }).join('') + '</div>' : '<div class="empty">Aucune demande d\'heures sup ou d\'acompte en attente.</div>';
  document.getElementById('sec-hsac').querySelector('.section-body').innerHTML = body;
  document.getElementById('hsac-count').textContent = all.length;
  document.getElementById('hsac-count').className = 'count' + (all.length===0 ? ' zero' : '');
}

function buildSections(){
  document.getElementById('sections').innerHTML =
    '<div class="section" id="sec-cp">' +
      '<div class="section-hdr" onclick="toggleSection(\'sec-cp\')"><h2>Congés payés &amp; absences en attente de validation</h2>' +
        '<span><span class="count" id="cp-count">0</span> <span class="chev">▾</span></span></div>' +
      '<div class="section-body"></div>' +
    '</div>' +
    '<div class="section" id="sec-var">' +
      '<div class="section-hdr" onclick="toggleSection(\'sec-var\')"><h2>Variables de paie — magasins non finalisés</h2>' +
        '<span><span class="count" id="var-count">0</span> <span class="chev">▾</span></span></div>' +
      '<div class="section-note" id="var-note"></div>' +
      '<div class="section-body"></div>' +
    '</div>' +
    '<div class="section" id="sec-samedi">' +
      '<div class="section-hdr" onclick="toggleSection(\'sec-samedi\')"><h2>Samedis tournants en attente (Edgard)</h2>' +
        '<span><span class="count" id="samedi-count">0</span> <span class="chev">▾</span></span></div>' +
      '<div class="section-body"></div>' +
    '</div>' +
    '<div class="section" id="sec-hsac">' +
      '<div class="section-hdr" onclick="toggleSection(\'sec-hsac\')"><h2>Heures supplémentaires &amp; acomptes en attente</h2>' +
        '<span><span class="count" id="hsac-count">0</span> <span class="chev">▾</span></span></div>' +
      '<div class="section-body"></div>' +
    '</div>';
}

function loadAll(){
  document.getElementById('lastUpdate').textContent = 'Chargement...';
  buildSections();

  var pCP = fetch(N8N_DEMANDES).then(function(r){ return r.json(); }).catch(function(){ return { data: [], archive: [] }; });
  var pVar = fetch(N8N_VARIABLES).then(function(r){ return r.json(); }).catch(function(){ return null; });
  var pSam = fetch(N8N_SAMEDIS).then(function(r){ return r.json(); }).catch(function(){ return { data: [] }; });
  var pHS = fetch(N8N_HS).then(function(r){ return r.json(); }).catch(function(){ return { data: [] }; });
  var pAC = fetch(N8N_ACOMPTE).then(function(r){ return r.json(); }).catch(function(){ return { data: [] }; });

  Promise.all([pCP, pVar, pSam, pHS, pAC]).then(function(results){
    var demandesRaw = Array.isArray(results[0]) ? results[0] : (results[0].data || []);
    var archiveRaw  = Array.isArray(results[0]) ? [] : (results[0].archive || []);
    var demandes = dedupeLatest(demandesRaw.concat(archiveRaw));
    STATE.cp = demandes.filter(function(d){ return d.statut === 'en_attente'; });

    STATE.variables = results[1] && results[1].magasins ? results[1] : null;

    var samRaw = Array.isArray(results[2]) ? results[2] : (results[2].data || []);
    STATE.samedis = samRaw.filter(function(s){ return s.statut === 'en_attente'; });

    STATE.hs = (results[3] && results[3].data) || [];
    STATE.acompte = (results[4] && results[4].data) || [];

    renderStats();
    renderCP();
    renderVariables();
    renderSamedis();
    renderHsAc();

    document.getElementById('lastUpdate').textContent = 'Mis à jour le ' + new Date().toLocaleString('fr-FR');
  }).catch(function(e){
    document.getElementById('lastUpdate').textContent = 'Erreur de chargement — réessayez plus tard';
    console.error(e);
  });
}
</script>
</body>
</html>
