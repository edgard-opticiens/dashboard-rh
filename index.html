<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tableau de bord RH — Groupe Edgard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#A97A2E;--gl:#D9AE6E;--spark:#D6602F;--dk:#1C1710;--md:#78705F;--lt:#FAF6EC;--bd:#E9E0CE;--bg:#F7F1E6;--green:#27AE60;--orange:#E67E22;--red:#C0392B;--blue:#2980B9;--purple:#8E44AD}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);min-height:100vh;padding:22px 16px 70px;color:var(--dk)}

#gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-box{background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);max-width:360px;width:100%;padding:30px 26px;text-align:center}
.gate-box h2{font-family:'Fraunces',serif;font-size:19px;margin-bottom:4px}
.gate-box p{font-size:12.5px;color:#666;margin-bottom:18px}
.gate-box input{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:6px;margin-bottom:10px;font-size:15px;font-family:'Inter',sans-serif;text-align:center;letter-spacing:.2em}
.gate-box button{width:100%;padding:11px;background:var(--dk);color:#fff;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer}
#gateErr{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}

#app{display:none}

.wrap{max-width:1500px;margin:0 auto}
.hero{position:relative;background:#fff;border:1px solid var(--bd);border-radius:22px;box-shadow:0 6px 28px rgba(60,40,10,.07);padding:30px 190px 30px 34px;margin-bottom:56px;overflow:visible}
.hero .lens{position:absolute;right:120px;top:-46px;width:210px;height:210px;color:var(--gl);opacity:.28;pointer-events:none}
.hero .clip{position:absolute;inset:0;border-radius:22px;overflow:hidden;pointer-events:none}
.hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--g);margin-bottom:6px}
.hero h1{font-family:'Fraunces',serif;font-weight:600;font-size:34px;line-height:1.1;color:var(--dk);font-variation-settings:'opsz' 72}
.hero .sub{font-size:12.5px;color:var(--md);margin-top:8px}
.hero .actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.refresh{background:var(--dk);color:#fff;border:none;padding:10px 20px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.refresh:hover{background:#3a3125}
.pill-info{font-size:11px;color:var(--md);background:var(--lt);border:1px solid var(--bd);border-radius:999px;padding:7px 14px}
.mascot{position:absolute;right:26px;bottom:-34px;width:128px;z-index:3;filter:drop-shadow(0 8px 10px rgba(40,25,5,.18))}
.dash-sec{background:rgba(255,255,255,.55);border:1px solid var(--bd);border-radius:24px;padding:26px 26px 30px;margin-bottom:34px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.sec-head .eb{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--spark);margin-bottom:4px}
.sec-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:26px;color:var(--dk);line-height:1.1;font-variation-settings:'opsz' 60}
.sec-head p{font-size:12.5px;color:var(--md);max-width:520px;text-align:right}
.panel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;align-items:start}
@media(max-width:760px){
  .hero{padding:24px 130px 26px 22px;margin-bottom:46px}
  .hero h1{font-size:26px}
  .hero .lens{right:-30px;top:-50px}
  .pill-info{display:none}
  .mascot{width:92px;right:14px;bottom:-30px}
  .dash-sec{padding:18px 14px 22px;border-radius:20px}
  .sec-head p{text-align:left}
  .panel-grid{grid-template-columns:repeat(2,1fr);gap:12px}
}
.panel{background:#fff;border-radius:18px;box-shadow:0 3px 14px rgba(60,40,10,.07);overflow:hidden;border-top:5px solid var(--pc);cursor:pointer;transition:box-shadow .15s}
.panel:hover{box-shadow:0 6px 22px rgba(0,0,0,.1)}
.panel.expanded{grid-column:1/-1;cursor:default}
.panel-face{padding:20px 18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.panel-face .n{font-family:'Fraunces',serif;font-size:30px;font-weight:700;line-height:1;color:var(--dk)}
.panel-face .n.ok{color:var(--green)}
.panel-face .l{font-size:10.5px;color:var(--md);text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
.panel-face .chev{display:none;font-size:16px;color:var(--md);transition:transform .15s;flex:0 0 auto}
.panel.expanded .panel-face{flex-direction:row;align-items:center;justify-content:space-between;text-align:left;padding:20px 24px 16px;border-bottom:1px solid var(--bd);gap:14px}
.panel.expanded .panel-face .n{font-size:24px}
.panel.expanded .panel-face .l{margin-top:6px;max-width:260px}
.panel.expanded .chev{display:block;transform:rotate(180deg)}
.panel-preview{padding:0 16px 16px;display:flex;flex-direction:column;gap:4px;min-height:18px}
.panel.expanded .panel-preview{display:none}
.panel-preview .pv-item{font-size:10.5px;color:var(--md);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-preview .pv-more{font-size:10px;color:#aaa;font-style:italic}
.panel-detail{display:none}
.panel.expanded .panel-detail{display:block;padding:16px 24px 22px;cursor:default}
.panel-note{font-size:11px;color:#999;margin-bottom:10px}
.panel-toolbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.panel-toolbar select{font-family:'Inter',sans-serif;font-size:12.5px;padding:7px 12px;border:1.5px solid var(--bd);border-radius:7px;background:#fff;color:var(--dk);cursor:pointer}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding:3px 8px;border-radius:5px;flex:0 0 auto;white-space:nowrap}
.tag.en_attente,.tag.incomplet,.tag.reseau,.tag.dir,.tag.rh1,.tag.resp,.tag.directeur,.tag.deruy{background:#FDEBD8;color:#a3560f}
.tag.non_envoye{background:#FADBD8;color:#943126}
.tag.complet{background:#D5F5E3;color:#1e7a45}
.empty{color:var(--md);font-size:12.5px;padding:14px 0;text-align:center}

.var-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:6px 0 12px}
.var-card{border-radius:10px;padding:14px 10px 12px;text-align:center;border:1.5px solid var(--bd);background:#FBFAF7}
.var-card .code{font-family:'Fraunces',serif;font-weight:700;font-size:16px;letter-spacing:.2px}
.var-card .dir{font-size:11px;color:var(--md);margin-top:3px;line-height:1.3;min-height:28px}
.var-card .badge{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:8px}
.var-card .sig{font-size:10px;color:var(--md);margin-top:4px}
.var-card.non_envoye{border-color:#F3C6B8;background:#FDF4F1}
.var-card.non_envoye .badge{background:#FADBD8;color:#943126}
.var-card.incomplet{border-color:#F6DCA8;background:#FEFAF0}
.var-card.incomplet .badge{background:#FDEBD8;color:#a3560f}
.var-card.complet{border-color:#A9DFBF;background:#F3FBF6}
.var-card.complet .badge{background:#D5F5E3;color:#1e7a45}
.var-card.finalise{border-color:#AED6F1;background:#F3F9FD}
.var-card.finalise .badge{background:#D6EAF8;color:#1f618d}
.var-card .finfo{font-size:10px;color:var(--md);margin-top:4px;line-height:1.35}
.var-card button.revoir{margin-top:6px;border-color:var(--purple);color:var(--purple)}
.var-card button.revoir:hover{background:var(--purple);color:#fff;border-color:var(--purple)}
.var-card button{display:block;margin:8px auto 0;font-size:9.5px;padding:4px 10px;border-radius:14px;border:1px solid var(--bd);background:#fff;color:var(--md);cursor:pointer;font-family:'Inter',sans-serif}
.var-card button:hover{background:var(--dk);color:#fff;border-color:var(--dk)}
.var-card button.relance{margin-top:6px;border-color:var(--blue);color:var(--blue)}
.var-card button.relance:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.var-card button.relance:disabled{opacity:.55;cursor:default;background:#fff;color:var(--blue)}
.var-card button.voir{margin-top:8px;border-color:var(--g);color:var(--g);font-weight:600}
.var-card button.voir:hover{background:var(--g);color:#fff;border-color:var(--g)}
.var-card button.annuler{border-color:var(--red);color:var(--red)}
.var-card button.annuler:hover{background:var(--red);color:#fff;border-color:var(--red)}
.var-final{margin-top:6px;padding:10px 12px;border-top:1px dashed var(--bd);font-size:11px;color:var(--md);line-height:2}
.var-final .chip{display:inline-flex;align-items:center;gap:5px;background:#F3F9FD;border:1px solid #AED6F1;border-radius:14px;padding:1px 4px 1px 9px;margin:0 4px 0 0;color:#1f618d;font-weight:600}
.var-final .chip button{border:0;background:none;color:var(--red);cursor:pointer;font-size:10.5px;font-family:'Inter',sans-serif;padding:2px 6px;border-radius:10px}
.var-final .chip button:hover{background:var(--red);color:#fff}
#vv-modal{display:none;position:fixed;inset:0;background:rgba(28,23,16,.5);z-index:300;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto}
#vv-modal.show{display:flex}
.vv-box{background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:100%;max-width:1080px;padding:22px 24px 20px;position:relative}
.vv-x{position:absolute;top:12px;right:14px;border:0;background:none;font-size:22px;line-height:1;color:var(--md);cursor:pointer;padding:4px 8px;border-radius:8px}
.vv-x:hover{background:var(--lt);color:var(--dk)}
.vv-box h2{font-family:'Fraunces',serif;font-size:21px;margin:0 28px 2px 0}
.vv-sub{font-size:12px;color:var(--md);margin-bottom:12px}
.vv-banner{font-size:12px;padding:8px 12px;border-radius:8px;margin:0 0 12px;line-height:1.45}
.vv-banner.info{background:#EAF3FB;color:#1f618d;border:1px solid #AED6F1}
.vv-banner.warn{background:#FEFAF0;color:#a3560f;border:1px solid #F6DCA8}
.vv-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
.vv-box table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
.vv-box th{background:var(--lt);color:var(--md);font-size:10px;text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:8px 9px;border-bottom:1px solid var(--bd);white-space:nowrap}
.vv-box td{padding:8px 9px;border-bottom:1px solid var(--bd);vertical-align:top}
.vv-box tr:last-child td{border-bottom:0}
.vv-box .nm{font-weight:600;white-space:nowrap}
.vv-abs{display:block;white-space:nowrap}
.vv-abs+.vv-abs{margin-top:3px}
.vv-tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:#EFE8D8;color:var(--dk);margin:0 4px}
.vv-ok{color:#1e7a45;font-weight:700;white-space:nowrap}
.vv-no{color:#a3560f;white-space:nowrap}
.vv-dir{margin-top:12px;font-size:12px;color:var(--md)}
.vv-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.vv-actions a{font-size:11.5px;font-weight:600;color:var(--blue);text-decoration:none;border:1px solid var(--blue);border-radius:16px;padding:5px 13px}
.vv-actions a:hover{background:var(--blue);color:#fff}
.var-card .portal{margin-top:9px;padding-top:8px;border-top:1px dashed var(--bd)}
.var-card .portal a{display:inline-block;font-size:10.5px;font-weight:700;color:var(--blue);text-decoration:none}
.var-card .portal a:hover{text-decoration:underline}
.var-card .portal .pin{font-size:10px;color:var(--md);margin-top:3px}
.var-card .portal .pin b{font-family:'Fraunces',serif;letter-spacing:.15em;color:var(--dk);font-size:12px}
.panel-toolbar select{margin-left:8px}
.panel-toolbar .tb-label{font-size:11px;color:var(--md);align-self:center}

/* Planning Edgard Developpement (calendrier mensuel) */
.ecal-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ecal-bar button{font-family:'Inter',sans-serif;font-size:12px;padding:6px 12px;border:1.5px solid var(--bd);border-radius:7px;background:#fff;color:var(--dk);cursor:pointer}
.ecal-bar button:hover{background:var(--dk);color:#fff;border-color:var(--dk)}
.ecal-bar .lbl{font-family:'Fraunces',serif;font-size:18px;font-weight:700;min-width:170px;text-align:center}
.ecal-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:11px;color:var(--md);margin-bottom:10px}
.ecal-legend .li{display:flex;align-items:center;gap:6px}
.ecal-legend .sw{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.ecal-stats{font-size:11.5px;color:var(--md);text-align:center;margin-bottom:12px}
.ecal{background:#fff;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.ecal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--dk)}
.ecal-dow div{color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:9px 4px}
.ecal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.eday{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);min-height:96px;padding:6px 5px;cursor:pointer;transition:background .1s}
.eday:hover{background:var(--lt)}
.eday:nth-child(7n){border-right:none}
.eday.out{background:#FAFAF8;color:#bbb;cursor:default}
.eday.today .num{background:var(--dk);color:#fff;border-radius:50%}
.eday.selected{background:#F1EAD6}
.eday .num{font-size:12px;font-weight:600;display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;margin-bottom:4px}
.ebub{display:block;font-size:9px;padding:1.5px 5px;border-radius:7px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.ebub.cp-valide{background:var(--green);color:#fff;font-weight:600}
.ebub.cp-attente{background:#E3F5E9;color:#1e7a45;border:1px dashed var(--green)}
.ebub.abs-valide{background:var(--orange);color:#fff;font-weight:600}
.ebub.abs-attente{background:#FDEBD8;color:#a3560f;border:1px dashed var(--orange)}
.ebub.rtt-valide{background:var(--blue);color:#fff;font-weight:600}
.ebub.rtt-attente{background:#DCEAF5;color:#1c5983;border:1px dashed var(--blue)}
.ebub.more{background:none;color:var(--md);font-weight:700;padding:1.5px 2px}
.edots{display:none;gap:2px;flex-wrap:wrap;margin-top:2px}
.edots span{width:6px;height:6px;border-radius:50%;display:inline-block}
.edot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}
.edot.cp-valide{background:var(--green)}
.edot.cp-attente{background:#E3F5E9;border:1.5px solid var(--green)}
.edot.abs-valide{background:var(--orange)}
.edot.abs-attente{background:#FDEBD8;border:1.5px solid var(--orange)}
.edot.rtt-valide{background:var(--blue)}
.edot.rtt-attente{background:#DCEAF5;border:1.5px solid var(--blue)}
.eform{margin-bottom:14px;background:var(--lt);border:1px solid var(--bd);border-radius:10px;padding:10px 16px}
.eform summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--dk)}
.eform-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;margin-top:12px;align-items:end}
.eform label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--md);margin-bottom:3px}
.eform select,.eform input[type=text],.eform input[type=date]{width:100%;font-family:'Inter',sans-serif;font-size:12.5px;padding:7px 10px;border:1.5px solid var(--bd);border-radius:7px;background:#fff;color:var(--dk)}
.eform .full{grid-column:1/-1}
.eform-actions{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.eform button.save{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;padding:8px 18px;border:none;border-radius:7px;background:var(--dk);color:#fff;cursor:pointer}
.eform button.save:disabled{opacity:.55;cursor:default}
.eform .msg{font-size:12px}
.eform .msg.ok{color:#1e7a45}.eform .msg.err{color:var(--red)}
.eform .hint{font-size:11px;color:#999;margin-top:8px}
.emanual{margin-top:14px}
.emanual h4{font-family:'Fraunces',serif;font-size:14px;margin-bottom:6px}
.emanual .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12.5px;flex-wrap:wrap}
.emanual .row:last-child{border-bottom:none}
.emanual .who{font-weight:700}
.emanual .meta{color:var(--md);font-size:11.5px;flex:1 1 200px}
.emanual button.del{font-size:9.5px;padding:4px 10px;border-radius:14px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;font-family:'Inter',sans-serif}
.emanual button.del:hover{background:var(--red);color:#fff}
.emanual button.del:disabled{opacity:.55;cursor:default}
.ebadge{font-size:9px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding:2px 7px;border-radius:5px;background:#EEE;color:#666}

/* ---- Planning directeurs ---- */
.dgrid-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:#fff}
table.dgrid{border-collapse:separate;border-spacing:0;font-size:11px;width:100%}
.dgrid th,.dgrid td{padding:0;border-bottom:1px solid #eee;text-align:center}
.dgrid thead th{background:var(--dk);color:#fff;font-weight:600;height:34px;min-width:26px;cursor:pointer;position:sticky;top:0}
.dgrid thead th.wk{background:#4a4a4a}
.dgrid thead th.today{background:var(--orange)}
.dgrid thead th.sel{outline:2px solid #fff;outline-offset:-3px}
.dgrid thead th.first{min-width:210px;text-align:left;padding:0 12px;cursor:default;position:sticky;left:0;z-index:3}
.dgrid thead th small{display:block;font-weight:400;font-size:8.5px;opacity:.8;line-height:1}
.dgrid td.first{position:sticky;left:0;background:#fff;text-align:left;padding:5px 12px;min-width:210px;z-index:2;border-right:1px solid var(--bd)}
.dgrid td.first .mag{font-weight:700;font-size:11.5px;color:var(--dk)}
.dgrid td.first .mag .tag{font-size:8.5px;font-weight:600;margin-left:6px;padding:1px 6px;border-radius:8px;background:#EEE;color:#777;text-transform:uppercase;letter-spacing:.3px}
.dgrid td.first .who{font-size:11px;color:#555}
.dgrid td.first .who a,.dgrid td.first .adj a{color:inherit;text-decoration:none;border-bottom:1px dotted #aaa}
.dgrid td.first .adj{font-size:10px;color:#999}
.dgrid tr.sep td{background:var(--lt);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--md);text-align:left;padding:6px 12px}
.dgrid td.c{height:34px;min-width:26px}
.dgrid td.c.wk{background:#f6f4ef}
.dgrid td.c.today{box-shadow:inset 2px 0 0 var(--orange),inset -2px 0 0 var(--orange)}
.dgrid td.c.sel{background:#fff7e6}
.dgrid td.c .b{display:block;height:22px;margin:0 -1px}
.dgrid td.c .b.cp-valide{background:var(--green)}
.dgrid td.c .b.cp-attente{background:repeating-linear-gradient(135deg,#E3F5E9,#E3F5E9 4px,#cbe9d5 4px,#cbe9d5 8px);border-top:1.5px dashed var(--green);border-bottom:1.5px dashed var(--green)}
.dgrid td.c.pick{cursor:pointer}
.dgrid td.c .b.rtt-valide{background:var(--blue)}
.dgrid td.c .b.rtt-attente{background:repeating-linear-gradient(135deg,#DCEAF5,#DCEAF5 4px,#bcd5ea 4px,#bcd5ea 8px);border-top:1.5px dashed var(--blue);border-bottom:1.5px dashed var(--blue)}
.dgrid td.c .b.abs-valide{background:var(--orange)}
.dgrid td.c .b.abs-attente{background:repeating-linear-gradient(135deg,#FDEBD8,#FDEBD8 4px,#f8d9b8 4px,#f8d9b8 8px);border-top:1.5px dashed var(--orange);border-bottom:1.5px dashed var(--orange)}
.dcontact{margin:0 0 14px;background:var(--lt);border:1px solid var(--bd);border-radius:10px;padding:12px 16px}
.dcontact h4{font-family:'Fraunces',serif;font-size:14px;margin-bottom:8px}
.dcontact .row{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12.5px;flex-wrap:wrap}
.dcontact .row:last-child{border-bottom:none}
.dcontact .mag{font-weight:700;min-width:96px}
.dcontact .abs{color:#a3560f}
.dcontact .to{flex:1 1 220px}
.dcontact .to a{color:var(--dk);font-weight:600}
.dcontact .none{color:var(--red);font-weight:600}
.dcontact .ok{color:#1e7a45;font-size:12.5px}
.dfilters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.dfilters button.pill{font-family:'Inter',sans-serif;font-size:11px;padding:5px 12px;border-radius:14px;border:1px solid var(--bd);background:#fff;color:var(--dk);cursor:pointer}
.dfilters button.pill.on{background:var(--dk);color:#fff;border-color:var(--dk)}
.edetail{margin-top:12px;background:var(--lt);border:1px solid var(--bd);border-radius:10px;padding:14px 18px}
.edetail h3{font-family:'Fraunces',serif;font-size:16px;margin-bottom:8px;text-transform:capitalize}
.edetail .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.edetail .row:last-child{border-bottom:none}
.edetail .name{font-weight:700;flex:0 0 auto}
.edetail .meta{color:var(--md);font-size:11.5px}
.edetail .close{float:right;background:none;border:none;font-size:13px;color:var(--md);cursor:pointer}
@media(max-width:640px){
  .eday{min-height:64px;padding:4px 3px}
  .ebub{display:none}
  .edots{display:flex}
  .ecal-bar .lbl{min-width:120px;font-size:15px}
  .ecal-dow div{font-size:8.5px}
}

.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:6px 0 12px}
.item-card{border-radius:10px;padding:14px 16px;border:1.5px solid var(--bd);background:#FEFAF0;display:flex;flex-direction:column;gap:7px}
.item-card.non_envoye{border-color:#F3C6B8;background:#FDF4F1}
.item-card.complet{border-color:#A9DFBF;background:#F3FBF6}
.item-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-card .who{font-weight:700;font-size:14px;line-height:1.3}
.item-card .tag{flex:0 0 auto}
.item-card .meta{color:var(--md);font-size:12px;line-height:1.4}
.item-card .since{color:#999;font-size:10.5px;margin-top:auto;padding-top:2px}
.item-card .btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.item-card button.relance{display:inline-block;font-size:9.5px;padding:4px 10px;border-radius:14px;border:1px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;font-family:'Inter',sans-serif}
.item-card button.relance:hover{background:var(--blue);color:#fff}
.item-card button.relance:disabled{opacity:.55;cursor:default;background:#fff;color:var(--blue)}
.item-card button.delete{display:inline-block;font-size:9.5px;padding:4px 10px;border-radius:14px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer;font-family:'Inter',sans-serif}
.item-card button.delete:hover{background:var(--red);color:#fff}
.item-card button.delete:disabled{opacity:.55;cursor:default;background:#fff;color:var(--red)}
.item-card a.consult{display:inline-block;font-size:9.5px;padding:4px 10px;border-radius:14px;border:1px solid var(--purple);background:#fff;color:var(--purple);cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none}
.item-card a.consult:hover{background:var(--purple);color:#fff}

.panel-toolbar input[type=number],.panel-toolbar input[type=text]{font-family:'Inter',sans-serif;font-size:12.5px;padding:6px 10px;border:1.5px solid var(--bd);border-radius:7px;background:#fff;color:var(--dk);width:90px}
.panel-toolbar input[type=text]{width:160px}
.soldes-wrap{overflow-x:auto}
.soldes-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:620px}
.soldes-table th{background:var(--dk);color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;text-align:left;white-space:nowrap}
.soldes-table td{padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
.soldes-table tr:last-child td{border-bottom:none}
.soldes-table tr:hover td{background:var(--lt)}
.soldes-table tr.alert td{background:#FDF0EE}
.soldes-table tr.alert td.total{color:var(--red)}
.soldes-table td.total{font-weight:700}
.soldes-table td.who{font-weight:600}
.soldes-table td.poses{color:var(--blue)}
/* ===== Statistiques portail ===== */
.st-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.st-kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.st-kpi .v{font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--dk);line-height:1.1}
.st-kpi .k{font-size:12px;color:var(--md);margin-top:3px}
.st-kpi .d{font-size:11.5px;color:var(--md);margin-top:6px}
.st-kpi .d b{color:var(--dk)}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.st-card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 16px;min-width:0}
.st-card.wide{grid-column:1/-1}
.st-card h4{font-size:13px;font-weight:600;color:var(--dk);margin-bottom:2px}
.st-card .sub{font-size:11.5px;color:var(--md);margin-bottom:12px}
.st-hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.st-hbar .lb{color:var(--dk);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-hbar .tr{background:#F3ECDD;border-radius:0 4px 4px 0;height:12px;position:relative}
.st-hbar .fi{background:var(--g);height:12px;border-radius:0 4px 4px 0;min-width:2px}
.st-hbar .nv{color:var(--dk);font-variant-numeric:tabular-nums;font-weight:600;min-width:28px;text-align:right}
.st-dev{display:flex;gap:2px;height:22px;margin:6px 0 10px}
.st-dev i{display:block;height:22px;min-width:3px}
.st-dev i:first-child{border-radius:6px 0 0 6px}.st-dev i:last-child{border-radius:0 6px 6px 0}
.st-leg{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--dk)}
.st-leg span.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.st-empty{font-size:12.5px;color:var(--md);padding:14px 2px}
.st-chart{position:relative}
.st-chart svg{display:block;width:100%;height:auto}
.st-tip{position:absolute;pointer-events:none;background:var(--dk);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:5}
.st-zero{font-size:12px;color:var(--md);margin-top:10px;line-height:1.5}
@media(max-width:760px){.st-kpis{grid-template-columns:1fr}.st-grid{grid-template-columns:1fr}.st-hbar{grid-template-columns:minmax(80px,45%) 1fr auto}}
#sec-stats .panel-toolbar{flex-wrap:wrap;gap:6px 0;justify-content:flex-end}
</style>
</head>

<script>
/* ============================ CONFIG ============================ */
/* ===== Connexion RH sécurisée =====
   Le code RH est vérifié par le serveur (n8n) ; la page ne garde qu'un jeton de session (30 jours),
   partagé avec les autres outils migrés (même navigateur, même site). Plus aucun code dans la page. */
var N8N_AUTH_LOGIN = 'https://edgard-opticiens.app.n8n.cloud/webhook/auth-login';
var N8N_AUTH_READ  = 'https://edgard-opticiens.app.n8n.cloud/webhook/secure-read';
var N8N_ROSTER     = 'https://edgard-opticiens.app.n8n.cloud/webhook/variables-roster';
var AUTH_KEY = 'edgard_auth_v2';
function authGet(){
  try{
    var o = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
    if (!o || !o.token || o.role !== 'RH') return null;
    if (Number(o.expire) <= Date.now()){ authClear(); return null; }
    return o;
  }catch(e){ return null; }
}
function authSave(o){ try{ localStorage.setItem(AUTH_KEY, JSON.stringify(o)); }catch(e){} }
function authClear(){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} }
function authPost(url, body){
  return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){ return {ok:false, error:'reponse'}; }).then(function(j){ j.httpStatus = r.status; return j; }); });
}
function authLogin(role, magasin, code){ return authPost(N8N_AUTH_LOGIN, {role:role, magasin:magasin, code:code}); }
/* Lecture protégée : si la session n'est plus valide, retour à l'écran de connexion */
function authRead(source, params){
  var a = authGet();
  if (!a) return Promise.reject(new Error('session'));
  return authPost(N8N_AUTH_READ, {token:a.token, source:source, params:params || {}}).then(function(j){
    if (j && j.ok) return j.resultat || {};
    if (j && (j.error === 'session' || j.httpStatus === 401)){ authClear(); location.reload(); }
    throw new Error((j && j.error) || 'lecture');
  });
}
/* Actions (POST) : le jeton de session est ajouté au corps de la requête */
function authFetch(url, opts){
  opts = opts || {};
  var a = authGet();
  if (opts.body && typeof opts.body === 'string'){
    try{ var b = JSON.parse(opts.body); if (a) b.token = a.token; opts.body = JSON.stringify(b); }catch(e){}
  }
  return fetch(url, opts);
}
/* Fiche d'un magasin (liste des collaborateurs du mois), lue sur le serveur */
function rosterStore(code){
  var a = authGet();
  if (!a) return Promise.resolve(null);
  return authPost(N8N_ROSTER, {token:a.token, action:'get', code:code}).then(function(j){ return (j && j.ok) ? j.store : null; }).catch(function(){ return null; });
}
function rhLogout(){ authClear(); try{ localStorage.removeItem('edgard_dir_session_v1'); }catch(e){} location.reload(); }

var N8N_DEMANDES  = 'https://edgard-opticiens.app.n8n.cloud/webhook/get-demandes';

var VAR_PERIODE_DEBUT = '2026-07'; // premier mois suivi dans l'historique

var VAR_PORTAL_BASE = 'https://edgard-opticiens.github.io/variables/';

var PIN_CACHE = {};

function startApp(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadAll();
  setInterval(loadAll, 300000);
}
function tryGate(){
  var pin = document.getElementById('gatePin').value.trim();
  var err = document.getElementById('gateErr');
  if (!pin){ err.textContent = 'Saisissez le code.'; return; }
  err.textContent = 'Vérification…';
  authLogin('RH', 'RH', pin).then(function(j){
    if (j && j.ok){
      authSave({token:j.token, role:j.role, magasin:j.magasin, expire:j.expire});
      document.getElementById('gatePin').value = '';
      err.textContent = '';
      startApp();
    } else if (j && j.error === 'verrouille'){
      err.textContent = 'Trop d\'essais. Réessayez dans ' + (j.minutes || 15) + ' min.';
      document.getElementById('gatePin').value = '';
    } else {
      err.textContent = 'Code incorrect.';
      document.getElementById('gatePin').value = '';
    }
  }).catch(function(){ err.textContent = 'Connexion au serveur impossible. Réessayez dans un instant.'; });
}
document.getElementById('gatePin').addEventListener('keydown', function(e){ if(e.key==='Enter') tryGate(); });
window.addEventListener('load', function(){ if (authGet()) startApp(); });

/* ============================ HELPERS ============================ */
function excelOrIsoDate(v){
  if (v==='' || v===null || v===undefined) return null;
  if (typeof v==='number' || /^\d+(\.\d+)?$/.test(v)) return new Date((Number(v)-25569)*86400000);
  var d = new Date(v);
  return isNaN(d) ? null : d;
}
function dedupeLatest(arr){
  var byId = {};
  arr.forEach(function(d){
    var id = d.id;
    if (!id){ byId[Math.random()] = d; return; }
    if (!byId[id] || new Date(d.date_derniere_action) > new Date(byId[id].date_derniere_action)) byId[id] = d;
  });
  return Object.values(byId);
}
function joursDepuis(dateVal){
  var d = excelOrIsoDate(dateVal);
  if (!d) return '';
  var days = Math.floor((new Date() - d) / 86400000);
  if (days <= 0) return 'aujourd\'hui';
  if (days === 1) return 'depuis 1 jour';
  return 'depuis ' + days + ' jours';
}
function fmtDate(dateVal){
  var d = excelOrIsoDate(dateVal);
  return d ? d.toLocaleDateString('fr-FR') : '';
}
function esc(s){ return (s||'').toString().replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function domId(s){ return String(s||'').replace(/[^a-zA-Z0-9_-]/g,'_'); }
function attrSafe(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function dparseFR(s){
  var m = String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]).getTime() : 0;
}
function normalizeNom(s){
  return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z]/g,'').toUpperCase();
}
function fmtNum(v){
  var n = Number(v)||0;
  return (Math.round(n*100)/100).toLocaleString('fr-FR');
}

var MOIS_ABBR = ['Janv','Févr','Mars','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];
function moisLabel(y, m){ return MOIS_ABBR[m-1] + ' ' + String(y).slice(2); }
function moisKey(y, m){ return y + '-' + (m<10?'0':'') + m; }
// Mois suivant (M+1) une date au format JJ/MM/AAAA — sert a demarrer le decompte des CP deja
// poses juste apres le mois de l'arrete de chaque magasin, comme sur les espaces directeurs.
function moisApres(dateFR){
  var mt = String(dateFR||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if (!mt) return null;
  var m = Number(mt[2]), y = Number(mt[3]);
  m += 1; if (m > 12){ m = 1; y += 1; }
  return { y: y, m: m };
}
function moisDeISO(iso){
  var mt = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return mt ? { y: Number(mt[1]), m: Number(mt[2]) } : null;
}
function fmtDateISO(iso){
  var d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return '';
  return d.toLocaleDateString('fr-FR');
}

var AC_ETAPE_LABEL = { resp: 'Attente signature responsable', dir: 'Attente signature Direction', rh: 'Attente traitement RH' };
var MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function periodesDisponibles(){
  var parts = VAR_PERIODE_DEBUT.split('-');
  var d = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
  var now = new Date();
  var cur = new Date(now.getFullYear(), now.getMonth(), 1);
  var list = [];
  while (d <= cur){
    list.push(d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'));
    d = new Date(d.getFullYear(), d.getMonth()+1, 1);
  }
  return list.reverse();
}
function libellePeriode(p){
  var parts = p.split('-');
  return MOIS_FR[Number(parts[1])-1] + ' ' + parts[0];
}

  var pending = info.magasins.filter(function(m){ return m.statut !== 'complet'; });
  var total = info.magasins.length;
  countEl.textContent = (total - pending.length) + '/' + total;
  countEl.className = 'n' + (pending.length===0 ? ' ok' : '');

  if (isCurrent){
    noteEl.textContent = 'Astuce : utilisez « Marquer finalisée » si une signature manquante ne viendra jamais.';
    var body = pending.length ? '<div class="var-grid">' + pending.map(function(m){
      var tagCls = m.statut === 'non_envoye' ? 'non_envoye' : 'incomplet';

        '<button type="button" onclick="finaliserVariable(\'' + esc(m.code) + '\')">Marquer finalisée</button>' +
        '<button type="button" class="relance" id="relance-' + esc(m.code) + '" onclick="relancerVariable(\'' + esc(m.code) + '\',\'' + tagCls + '\',' + (m.signatures_ok||0) + ',' + (m.total_salaries||0) + ')">✉️ Relancer</button>' +

        return '<span class="chip">' + esc(m.code) +

      var t = m.statut === 'non_envoye' ? 'Non envoyée' : ('Incomplète ' + (m.signatures_ok||0) + '/' + (m.total_salaries||0));
      return esc(m.code) + ' — ' + t;
    }));

  }

  // Période passée : vue historique — tous les magasins, y compris ceux déjà complets/finalisés,
  // pour pouvoir revoir la fiche et retélécharger le PDF si besoin.
  noteEl.textContent = 'Historique de ' + libellePeriode(info.periode) + ' — les fiches déjà signées peuvent être rouvertes et retéléchargées (bouton « 📄 Télécharger le PDF » dans le portail). Pour un magasin non envoyé ou incomplet, « Marquer finalisée » clôture quand même la période.';

    var tagTxt = m.statut === 'complet' ? (m.finalise_manuel ? 'Finalisée manuellement' : 'Complète') : (m.statut === 'non_envoye' ? 'Non envoyée' : 'Incomplète');
    var sig = (m.statut !== 'non_envoye') ? '<div class="sig">' + m.signatures_ok + ' / ' + m.total_salaries + ' signés</div>' : '';

      '</div>';
  }).join('') + '</div>' : '<div class="empty">Aucune donnée pour ' + libellePeriode(info.periode) + '.</div>';
  box.innerHTML = body2;
  loadPinsFor(all.filter(function(m){ return m.statut === 'complet' && !m.finalise_manuel; }).map(function(m){ return m.code; }));
  document.getElementById('var-preview').innerHTML = previewHtml(pending.map(function(m){
    var t = m.statut === 'non_envoye' ? 'Non envoyée' : ('Incomplète ' + (m.signatures_ok||0) + '/' + (m.total_salaries||0));
    return esc(m.code) + ' — ' + t;
  }));
}

function vvDate(iso){

  return m ? (m[3] + '/' + m[2] + '/' + m[1]) : (iso || '');
}
function voirVariable(code){

    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.etat || typeof LZString === 'undefined') return null;
      var js = LZString.decompressFromEncodedURIComponent(d.etat);
      return js ? JSON.parse(js) : null;
    }).catch(function(){ return null; });

  Promise.all([pData, pEtat]).then(function(res){
    var data = res[0], snap = res[1];

        html += '<div class="vv-banner info">Le magasin n\'a encore rien enregistré pour cette période : voici la fiche <b>pré-remplie</b> (données déposées). Les absences et signatures apparaîtront ici dès qu\'elles seront saisies.</div>';
      }

        if (pj !== periode){
          html += '<div class="vv-banner warn">Attention : les données déposées pour ce magasin sont libellées <b>' + esc(libellePeriode(pj)) + '</b>, pas ' + esc(libellePeriode(periode)) + '.</div>';
        }

        (aEtat ? '<th>Absences</th>' : '') +

        '</tr></thead><tbody>' + collabs.map(function(c){

            abs = '<td>' + (lignes.length ? lignes.map(function(a){

              var det = [];

            }).join('') : '<span style="color:var(--md)">—</span>') + '</td>';
          }
          return '<tr><td class="nm">' + esc(c.nom || '') + ' ' + esc(c.prenom || '') + '</td>' +
            '<td>' + esc(c.tps || '') + '</td>' + abs +

function relancerVariable(code, statut, signaturesOk, totalSalaries){
  var parts = (VAR_PERIODE || '').split('-');
  var annee = Number(parts[0]) || new Date().getFullYear();
  var moisTxt = MOIS_FR[Number(parts[1]) - 1] || '';
  if (!confirm('Envoyer un e-mail de rappel au directeur de ' + code + ' pour ' + libellePeriode(VAR_PERIODE) + ' ?')) return;
  var btn = document.getElementById('relance-' + code);
  if (btn){ btn.disabled = true; btn.textContent = 'Envoi…'; }
  authFetch(N8N_VAR_RELANCE, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      code: code, magasin_nom: code, periode: VAR_PERIODE, moisTxt: moisTxt, annee: annee,
      statut: statut, signatures_ok: signaturesOk, total_salaries: totalSalaries
    })
  }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(data){ return {ok:r.ok, data:data}; }); })
    .then(function(res){
      if (res.ok && res.data && res.data.ok){
        if (btn){ btn.textContent = '✔️ Envoyé'; }
        setTimeout(function(){ if (btn){ btn.disabled = false; btn.textContent = '✉️ Relancer'; } }, 4000);
      } else {
        alert((res.data && res.data.error) || "Erreur lors de l'envoi de la relance — réessayez.");
        if (btn){ btn.disabled = false; btn.textContent = '✉️ Relancer'; }
      }
    })
    .catch(function(){
      alert("Erreur lors de l'envoi de la relance — réessayez.");
      if (btn){ btn.disabled = false; btn.textContent = '✉️ Relancer'; }
    });
}

  var btn = document.getElementById('del-cp-' + domId(id));
  if (btn){ btn.disabled = true; btn.textContent = 'Suppression…'; }

function buildSoldesFlat(tout, futuresCP){
  var out = [];
  var arretes = {};
  var starts = []; // { y, m } — mois suivant l'arrete (M+1), un par magasin ayant des donnees
  var stores = [];

  Object.keys(tout || {}).forEach(function(mag){
    var store = tout[mag];
    if (!store) return;
    // Deux formats possibles pour un magasin : le nouveau (plusieurs instantanés dans
    // "historique", on prend le plus récent) ou l'ancien (un instantané unique directement
    // sur l'objet magasin — c'est le format produit par un dépôt frais depuis Cegid).
    var snap = (store.historique && store.historique.length)
      ? store.historique.slice().sort(function(a,b){ return dparseFR(b.arrete) - dparseFR(a.arrete); })[0]
      : store;
    if (!snap || !snap.etablissements) return;
    if (snap.arrete) arretes[snap.arrete] = true;
    var debut = moisApres(snap.arrete);
    if (debut) starts.push(debut);
    stores.push({ mag: mag, snap: snap });
  });

  // Grille de mois commune a tous les magasins : du plus ancien "mois suivant l'arrete" (M+1)
  // jusqu'a la fin de la periode CP en cours — exactement la fenetre utilisee dans l'outil des
  // directeurs (colonnes "Xj pris" par mois), ici calculee dynamiquement a partir des arretes reels.
  var debutGrille = starts.length
    ? starts.reduce(function(a,b){ return (a.y < b.y || (a.y === b.y && a.m <= b.m)) ? a : b; })
    : SOLDES_FIN_PERIODE;
  var mois = [];
  var cy = debutGrille.y, cm = debutGrille.m;
  while (cy < SOLDES_FIN_PERIODE.y || (cy === SOLDES_FIN_PERIODE.y && cm <= SOLDES_FIN_PERIODE.m)){
    mois.push({ y: cy, m: cm, key: moisKey(cy, cm), label: moisLabel(cy, cm) });
    cm += 1; if (cm > 12){ cm = 1; cy += 1; }
    if (mois.length > 24) break; // garde-fou
  }
  var moisIndex = {};
  mois.forEach(function(mm, i){ moisIndex[mm.key] = i; });

  stores.forEach(function(st){
    var mag = st.mag, snap = st.snap;

    // CP deja valides via l'outil digital, repartis par mois (le backend n8n exclut deja tout ce
    // qui est anterieur ou egal a la date d'arrete exacte de ce magasin — pas de risque de double
    // comptage ici, on se contente de les ranger dans la bonne colonne de la grille commune).
    var posesParKey = {};
    ((futuresCP && futuresCP[mag]) || []).forEach(function(f){
      var mi = moisDeISO(f.dateDebut);
      if (!mi) return;
      var idx = moisIndex[moisKey(mi.y, mi.m)];
      if (idx === undefined) return; // hors de la grille (avant M+1 global ou apres la fin de periode)
      var k = normalizeNom((f.nom||'') + (f.prenom||''));
      if (!posesParKey[k]) posesParKey[k] = mois.map(function(){ return 0; });
      posesParKey[k][idx] += Number(f.nbJours || 0);
    });

    (snap.etablissements || []).forEach(function(et){
      (et.salaries || []).forEach(function(s){
        var report = Number(s.report || 0);
        var n1 = s.n1 || {}, n = s.n || {};
        var n1Restant = Number(n1.restant || 0), nRestant = Number(n.restant || 0);
        var totalBrut = report + n1Restant + nRestant;
        var mensuel = posesParKey[normalizeNom(s.nom)] || mois.map(function(){ return 0; });
        var poses = mensuel.reduce(function(acc, v){ return acc + v; }, 0);

        // Les jours deja poses sont imputes sur l'enveloppe la plus ancienne en premier (report,
        // puis N-1, puis N) : c'est l'ordre reel de consommation des CP (les plus anciens doivent
        // etre soldes avant la fin de periode), donc les colonnes affichees sont nettes des jours
        // deja poses plutot qu'un seul total global indistinct.
        var restantAPutter = poses;
        var reportDeduit = Math.min(report, restantAPutter); restantAPutter -= reportDeduit;
        var n1Deduit = Math.min(n1Restant, restantAPutter); restantAPutter -= n1Deduit;
        var nDeduit = Math.min(nRestant, restantAPutter); restantAPutter -= nDeduit;
        var reportNet = report - reportDeduit;
        var n1RestantNet = n1Restant - n1Deduit;
        var nRestantNet = nRestant - nDeduit;
        // restantAPutter > 0 signifierait plus de jours poses que de solde brut disponible (anomalie
        // de donnees) : on ne passe jamais en negatif, le total reste a 0 dans ce cas.

        out.push({
          magasin: mag, nom: s.nom || '', matricule: s.matricule || '',
          report: reportNet, n1Restant: n1RestantNet, nRestant: nRestantNet,
          reportBrut: report, n1RestantBrut: n1Restant, nRestantBrut: nRestant,
          totalBrut: totalBrut, mensuel: mensuel, poses: poses, total: reportNet + n1RestantNet + nRestantNet,
          depassement: restantAPutter > 0.0001 ? restantAPutter : 0,
          arrete: snap.arrete || ''
        });
      });
    });
  });
  return { list: out, arretes: Object.keys(arretes).sort(function(a,b){ return dparseFR(b)-dparseFR(a); }), mois: mois };
}

function renderSoldes(){
  var filterEl = document.getElementById('soldes-soc-filter');
  var seuilEl = document.getElementById('soldes-seuil');
  var searchEl = document.getElementById('soldes-search');
  var seuil = Number(seuilEl.value) || 0;

  var socsSeen = {}, socs = [];
  STATE.soldes.forEach(function(d){
    if (d.magasin && !socsSeen[d.magasin]){ socsSeen[d.magasin] = true; socs.push(d.magasin); }
  });
  socs.sort();
  var currentVal = filterEl.value;
  filterEl.innerHTML = '<option value="">Tous les magasins (' + STATE.soldes.length + ')</option>' + socs.map(function(s){
    var cnt = STATE.soldes.filter(function(d){ return d.magasin === s; }).length;
    return '<option value="' + esc(s) + '">' + esc(s) + ' (' + cnt + ')</option>';
  }).join('');
  if (socs.indexOf(currentVal) !== -1) filterEl.value = currentVal;
  var activeSoc = filterEl.value;
  var search = (searchEl.value || '').toLowerCase().trim();

  var filtered = STATE.soldes.filter(function(d){
    if (activeSoc && d.magasin !== activeSoc) return false;
    if (search && d.nom.toLowerCase().indexOf(search) === -1) return false;
    return true;
  }).sort(function(a,b){ return b.total - a.total; });

  var mois = STATE.soldesMois || [];
  var box = document.getElementById('sec-soldes').querySelector('.panel-body');
  if (!filtered.length){
    box.innerHTML = '<div class="empty">Aucun salarié' + (activeSoc ? ' pour ' + esc(activeSoc) : '') + (search ? ' pour « ' + esc(search) + ' »' : '') + '.</div>';
  } else {
    var moisHeaders = mois.map(function(mm){ return '<th>' + esc(mm.label) + '</th>'; }).join('');
    box.innerHTML = '<div class="soldes-wrap"><table class="soldes-table"><thead><tr>' +
      '<th>Salarié</th><th>Magasin</th><th>Antérieur net</th><th>Restant N-1 net</th><th>Restant N net</th>' + moisHeaders + '<th>Solde estimé</th><th>Arrêté au</th>' +
      '</tr></thead><tbody>' + filtered.map(function(d){
        var isAlert = seuil > 0 && d.total >= seuil;
        var moisCells = (d.mensuel || mois.map(function(){ return 0; })).map(function(v){
          return '<td class="poses">' + (v > 0 ? '− ' + fmtNum(v) : '—') + '</td>';
        }).join('');
        var titreAnomalie = d.depassement > 0
          ? ' title="Anomalie : ' + fmtNum(d.depassement) + ' j posés en plus du solde brut disponible — à vérifier"'
          : '';
        var rowCls = (isAlert || d.depassement > 0) ? ' class="alert"' : '';
        return '<tr' + rowCls + titreAnomalie + '>' +
          '<td class="who">' + esc(d.nom) + (d.depassement > 0 ? ' ⚠️' : '') + '</td>' +
          '<td>' + esc(d.magasin) + '</td>' +
          '<td>' + fmtNum(d.report) + '</td>' +
          '<td>' + fmtNum(d.n1Restant) + '</td>' +
          '<td>' + fmtNum(d.nRestant) + '</td>' +
          moisCells +
          '<td class="total">' + fmtNum(d.total) + ' j</td>' +
          '<td>' + esc(d.arrete) + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';
  }

  var overSeuil = STATE.soldes.filter(function(d){ return seuil > 0 && d.total >= seuil; });
  document.getElementById('soldes-count').textContent = overSeuil.length;
  document.getElementById('soldes-count').className = 'n' + (overSeuil.length === 0 ? ' ok' : '');
  document.getElementById('soldes-preview').innerHTML = previewHtml(
    overSeuil.slice().sort(function(a,b){ return b.total - a.total; }).map(function(d){
      return esc(d.nom) + ' — ' + esc(d.magasin) + ' (' + fmtNum(d.total) + ' j)';
    })
  );
  var noteEl = document.getElementById('soldes-note');
  var arretesTxt = STATE.soldesArretes.length ? STATE.soldesArretes.join(', ') : '—';
  var periodeTxt = mois.length ? (mois[0].label + ' à ' + mois[mois.length-1].label) : '—';
  noteEl.textContent = 'Soldes arrêtés au : ' + arretesTxt + '. Les colonnes mensuelles (' + periodeTxt + ') indiquent, comme sur les espaces directeurs, les CP déjà posés via l\'outil digital mois par mois, du mois suivant l\'arrêté de chaque magasin jusqu\'à la fin de la période (31/05/2027). Les colonnes Antérieur / Restant N-1 / Restant N sont déjà nettes de ces jours posés, imputés sur l\'enveloppe la plus ancienne en premier (Antérieur, puis N-1, puis N) — comme pour une consommation réelle des congés. Ajustez le seuil pour repérer les situations à surveiller.';
}

    sec('Partie 2', 'Informations diverses', 'Soldes de congés, planning d\'Edgard Développement, planning consolidé des directeurs et statistiques d\'utilisation du portail RH.', P.soldes + P.edev + P.dirs + P.stats);
}

/* ============================ PLANNING EDGARD DEVELOPPEMENT ============================ */
var EDEV_CUR = null;   // 1er du mois affiche
var EDEV_SEL = null;   // 'YYYY-MM-DD' du jour ouvert dans le detail
var EDEV_MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
var EDEV_TYPES = [ ['CP','Congés payés'], ['RTT','RTT'], ['Evt Fam','Événement familial'], ['CSS','CSS'], ['ANR','ANR'], ['Maladie','Maladie / arrêt'], ['Autre absence','Autre absence'] ];
var EDEV_PERIODES = ['Journée entière','Matin','Après-midi'];
var EDEV_FORM = { open: false, who: '', nom: '', prenom: '', type: 'CP', periode: 'Journée entière', d1: '', d2: '', comment: '', msg: '', err: false, busy: false };

function edevKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function edevPrenom(v){ return String(v||'').replace(/\s+/g,' ').trim().toLocaleLowerCase('fr').replace(/(^|[\s\-'’])(\S)/g, function(m,a,b){ return a + b.toLocaleUpperCase('fr'); }); }
function edevNom(v){ return String(v||'').replace(/\s+/g,' ').trim().toLocaleUpperCase('fr'); }
function edevShort(prenom, nom){
  nom = edevNom(nom);
  return edevPrenom(prenom) + (nom ? ' ' + nom.charAt(0) + '.' : '');
}
function edevDay(v){
  var d = excelOrIsoDate(v);
  if (!d) return null;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function edevIsoDay(s){
  var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
// Categorie d'affichage : cp (vert), rtt (bleu), abs (orange)
function edevCat(c){
  if (c.type === 'RTT' || c.motif === 'RTT') return 'rtt';
  if (c.type === 'CP') return 'cp';
  return /ABS/.test(String(c.type||'').toUpperCase()) || c.manual ? 'abs' : 'cp';
}
function edevIsValide(c){ return c.statut !== 'en_attente'; }
function edevCls(c){ return edevCat(c) + (edevIsValide(c) ? '-valide' : '-attente'); }
function edevTypeLib(c){
  if (c.manual){
    var t = EDEV_TYPES.filter(function(x){ return x[0] === c.type; })[0];
    return t ? t[1] : c.type;
  }
  if (c.motif) return absMotifLib(c.motif);
  var u = String(c.type||'').toUpperCase();
  return u === 'CP' ? 'Congés payés' : (u === 'ABS' ? 'Absence' : (u === 'CP+ABS' ? 'CP + absence' : (c.type || 'Demande')));
}
function edevLib(c){
  return edevTypeLib(c) + (c.periode && c.periode !== 'Journée entière' ? ' (' + c.periode.toLowerCase() + ')' : '') +
    (edevIsValide(c) ? ' — validé' : ' — en attente') + (c.manual ? ' · saisie manuelle' : '');
}
/* --- Motif des absences (RTT, CSS, ANR, evt familial...) ---
   1) lu dans le payload de la demande (lien ?id=... ou ?r=...), quand le lien a ete conserve dans le suivi ;
   2) sinon corrige a la main par la RH (table absence_motifs), qui l'emporte toujours. */
var ABS_MOTIFS = [ ['RTT','RTT'], ['Evt Fam','Événement familial'], ['Décès','Décès'], ['CSS','CSS'], ['ANR','ANR'], ['Congé révision','Congé révision apprenti'], ['Maladie','Maladie / arrêt'], ['Autre absence','Autre absence'] ];
var STORE_MOTIF = { evt: 'Evt Fam', dec: 'Décès', rev: 'Congé révision', css: 'CSS', anr: 'ANR', rtt: 'RTT' };
var ABS_PAY = {};   // cle -> payload | null
function absMotifLib(m){
  var t = ABS_MOTIFS.concat(EDEV_TYPES).filter(function(x){ return x[0] === m; })[0];
  return t ? t[1] : m;
}
function absPayKey(lien){
  lien = String(lien || '');
  var dev = /conges-payes-edgarddev/i.test(lien);
  var m = /[?&]id=([^&#]+)/.exec(lien);
  if (m) return { kind: 'id', v: decodeURIComponent(m[1]), dev: dev };
  m = /[?&]r=([^&#]+)/.exec(lien);
  if (m) return { kind: 'r', v: m[1], dev: dev };
  return null;
}
function absKeyStr(k){ return (k.dev ? 'd' : 's') + k.kind + ':' + k.v; }
function absPayload(k){
  var ck = absKeyStr(k);
  if (ck in ABS_PAY) return Promise.resolve(ABS_PAY[ck]);
  if (k.kind === 'r'){
    var p; try { p = JSON.parse(decodeURIComponent(k.v)); } catch(e){ p = null; }
    ABS_PAY[ck] = p; return Promise.resolve(p);
  }
  return authRead(k.dev ? 'edev_payload' : 'lien_court', {id: k.v})
    .then(function(res){
      var p = null;
      try { p = res && res.data ? (typeof res.data === 'string' ? JSON.parse(res.data) : res.data) : null; } catch(e){}
      ABS_PAY[ck] = p; return p;
    })
    .catch(function(){ return null; });   // pas mis en cache : nouvel essai au prochain rafraichissement
}
/* Payload (Edgard Dev ou magasins) -> { cp:{d,f}|null, abs:{motif,d,f,periode,comment}|null } */
function absNorm(p){
  var out = { cp: null, abs: null };
  if (!p) return out;
  if (p.cp && p.cp.d && p.cp.on !== false) out.cp = { d: p.cp.d, f: p.cp.f || p.cp.d };
  var a = p.abs;
  if (a && a.on !== false && a.d){
    var motif = a.motif || STORE_MOTIF[a.m] || (a.mL ? String(a.mL).replace(/^[^A-Za-zÀ-ÿ]+/, '').trim() : '');
    var comment = motif === 'RTT' ? (isNaN(Number(a.j)) ? String(a.j || '') : '') : String(a.detail || a.evtM || '');
    out.abs = { motif: motif, d: a.d, f: a.f || a.d, periode: motif === 'RTT' ? (a.rttPer || '') : '', comment: comment };
  }
  return out;
}
function absExpand(c){
  var isAbs = /ABS/.test(String(c.type||'').toUpperCase());
  if (!isAbs) return [c];
  var k = absPayKey(c.lien), p = k ? ABS_PAY[absKeyStr(k)] : null;
  var n = absNorm(p), ov = STATE.motifs[c.rid] || '';
  var out = [];
  if (n.cp){
    var cd = edevIsoDay(n.cp.d);
    if (cd) out.push(Object.assign({}, c, { type: 'CP', motif: undefined, debut: cd, fin: edevIsoDay(n.cp.f) || cd }));
  }
  if (n.abs){
    var ad = edevIsoDay(n.abs.d) || c.debut;
    out.push(Object.assign({}, c, { type: 'ABS', motif: ov || n.abs.motif, periode: n.abs.periode, comment: n.abs.comment, debut: ad, fin: edevIsoDay(n.abs.f) || ad }));
  }
  if (!out.length) out.push(Object.assign({}, c, { motif: ov || undefined }));
  return out;
}
function absEnrich(list, onlyIf){
  var todo = [], seen = {};
  list.forEach(function(c){
    if (!/ABS/.test(String(c.type||'').toUpperCase())) return;
    if (onlyIf && !onlyIf(c)) return;
    var k = absPayKey(c.lien); if (!k) return;
    var ck = absKeyStr(k);
    if (ck in ABS_PAY || seen[ck]) return;
    seen[ck] = true; todo.push(k);
  });
  return Promise.all(todo.map(absPayload));
}
function absApi(body){
  return authFetch(N8N_ABS_MOTIFS, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }).then(function(r){ return r.json(); });
}
function absMotifsLoad(){
  return absApi({ action: 'list' }).then(function(res){
    var m = {}; ((res && res.data) || []).forEach(function(r){ if (r.id && r.motif) m[r.id] = r.motif; });
    STATE.motifs = m;
  }).catch(function(){ /* on garde les corrections deja chargees */ });
}
function absRebuildAll(){ edevRebuild(); dirsRebuild(); }
function absRenderAll(){ renderEdev(); renderDirs(); }
function edevRebuild(){
  var out = [];
  STATE.edevBase.forEach(function(c){ absExpand(c).forEach(function(x){ out.push(x); }); });
  STATE.edev = out;
}
function edevEnrich(){ return absEnrich(STATE.edevBase); }
function dirsRebuild(){
  var out = [];
  STATE.dirsBase.forEach(function(c){ absExpand(c).forEach(function(x){ out.push(x); }); });
  STATE.dirsAbs = out;
}
function dirsEnrich(){ return absEnrich(STATE.dirsBase); }

/* Fenetre "Preciser le type de l'absence" */
function absPick(rid){
  var base = STATE.dirsBase.concat(STATE.edevBase).filter(function(x){ return String(x.rid) === String(rid); })[0];
  if (!base) return;
  var seg = absExpand(base).filter(function(x){ return /ABS/.test(String(x.type||'').toUpperCase()); })[0] || base;
  var cur = seg.motif || '';
  var old = document.getElementById('abs-pick'); if (old) old.remove();
  var ov = document.createElement('div');
  ov.id = 'abs-pick';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  var opts = '<option value="">— Non précisé (absence) —</option>' + ABS_MOTIFS.map(function(t){ return '<option value="' + esc(t[0]) + '"' + (cur === t[0] ? ' selected' : '') + '>' + esc(t[1]) + '</option>'; }).join('');
  ov.innerHTML = '<div style="background:#fff;border-radius:14px;padding:20px 22px;max-width:400px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.28);font-family:\'Inter\',sans-serif;color:#1a1a1a">' +
    '<div style="font-family:\'Fraunces\',serif;font-size:16px;font-weight:700;margin-bottom:4px">Type de l\'absence</div>' +
    '<div style="font-size:12.5px;color:#666;margin-bottom:12px">' + esc(edevPrenom(base.prenom)) + ' ' + esc(edevNom(base.nom)) + ' — du ' + seg.debut.toLocaleDateString('fr-FR') + (seg.fin && seg.fin.getTime() !== seg.debut.getTime() ? ' au ' + seg.fin.toLocaleDateString('fr-FR') : '') + '</div>' +
    '<select id="abs-pick-sel" style="width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1.5px solid #ddd;border-radius:8px">' + opts + '</select>' +
    '<div style="font-size:11px;color:#999;margin-top:8px">Le RTT s\'affiche en bleu, les autres absences en orange. Ce choix ne modifie pas le fichier de suivi des demandes.</div>' +
    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;align-items:center"><span id="abs-pick-msg" style="font-size:12px;color:#c0392b;flex:1"></span>' +
    '<button id="abs-pick-cancel" style="font-family:inherit;font-size:12.5px;padding:8px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer">Annuler</button>' +
    '<button id="abs-pick-save" style="font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 18px;border:none;border-radius:8px;background:#1a1a1a;color:#fff;cursor:pointer">Enregistrer</button></div></div>';
  document.body.appendChild(ov);
  function close(){ ov.remove(); }
  ov.addEventListener('click', function(e){ if (e.target === ov) close(); });
  document.getElementById('abs-pick-cancel').onclick = close;
  document.getElementById('abs-pick-save').onclick = function(){
    var val = document.getElementById('abs-pick-sel').value, btn = this;
    btn.disabled = true; document.getElementById('abs-pick-msg').textContent = '';
    absApi(val ? { action: 'set', id: rid, motif: val } : { action: 'clear', id: rid })
      .then(function(res){ if (!res || !res.ok) throw new Error(); return absMotifsLoad(); })
      .then(function(){ absRebuildAll(); absRenderAll(); close(); })
      .catch(function(){ btn.disabled = false; document.getElementById('abs-pick-msg').textContent = 'Erreur — réessayez.'; });
  };
}

function edevItems(){ return STATE.edev.concat(STATE.edevManuel); }

function edevBuildMap(){
  var y = EDEV_CUR.getFullYear(), m = EDEV_CUR.getMonth();
  var ms = new Date(y, m, 1), me = new Date(y, m+1, 0);
  var map = {};
  edevItems().forEach(function(c){
    var fin = c.fin || c.debut;
    if (fin < ms || c.debut > me) return;
    var d = new Date(Math.max(c.debut, ms)), last = new Date(Math.min(fin, me));
    while (d <= last){
      var k = edevKey(d);
      (map[k] = map[k] || []).push({ cls: edevCls(c), label: edevShort(c.prenom, c.nom), nom: edevNom(c.nom), prenom: edevPrenom(c.prenom), lib: edevLib(c), comment: c.comment || '', rid: (!c.manual && /ABS/.test(String(c.type||'').toUpperCase())) ? c.rid : '' });
      d.setDate(d.getDate() + 1);
    }
  });
  return map;
}

function edevShift(n){ EDEV_CUR = new Date(EDEV_CUR.getFullYear(), EDEV_CUR.getMonth() + n, 1); EDEV_SEL = null; renderEdev(); }
function edevToday(){ var t = new Date(); EDEV_CUR = new Date(t.getFullYear(), t.getMonth(), 1); EDEV_SEL = null; renderEdev(); }

function edevApi(body){
  return authFetch(N8N_EDEV_SAISIES, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); });

function edevLoadManual(){
  return edevApi({ action: 'list' }).then(function(res){
    STATE.edevManuel = ((res && res.data) || []).map(function(r){
      var debut = edevIsoDay(r.date_debut);
      return { id: r.id, nom: r.nom, prenom: r.prenom, type: r.type, periode: r.periode || '', comment: r.commentaire || '',
               statut: 'valide', manual: true, debut: debut, fin: edevIsoDay(r.date_fin) || debut, saisi_le: r.saisi_le };
    }).filter(function(c){ return c.debut; });
  }).catch(function(){ STATE.edevManuel = STATE.edevManuel || []; });
}
function edevPeople(){
  var seen = {}, list = [];
  edevItems().forEach(function(c){
    var k = normalizeNom(c.nom) + '|' + normalizeNom(c.prenom);
    if (!normalizeNom(c.nom) || seen[k]) return;
    seen[k] = true;
    list.push({ nom: c.nom, prenom: c.prenom });
  });
  list.sort(function(a,b){ return (a.nom + a.prenom).toLowerCase() < (b.nom + b.prenom).toLowerCase() ? -1 : 1; });
  return list;
}
function edevF(field, val){ EDEV_FORM[field] = val; }
function edevFormWho(val){
  EDEV_FORM.who = val;
  var box = document.getElementById('edev-autre');

  if (d2 && (!EDEV_FORM.d2 || EDEV_FORM.d2 < val)){ EDEV_FORM.d2 = val; d2.value = val; }

function edevSave(){
  var f = EDEV_FORM, nom, prenom;
  if (f.who === '__autre'){ nom = (f.nom||'').trim(); prenom = (f.prenom||'').trim(); }
  else if (f.who !== ''){ var p = edevPeople()[Number(f.who)]; nom = p && p.nom; prenom = p && p.prenom; }
  nom = edevNom(nom); prenom = edevPrenom(prenom);
  if (!nom || !prenom){ edevSetMsg('Choisissez un collaborateur (ou saisissez nom et prénom).', true); return; }
  if (!f.d1){ edevSetMsg('Indiquez la date de début.', true); return; }
  var d2 = f.d2 || f.d1;
  if (d2 < f.d1){ edevSetMsg('La date de fin précède la date de début.', true); return; }
  f.busy = true; edevSetMsg('Enregistrement…', false);
  var btn = document.getElementById('edev-save'); if (btn) btn.disabled = true;
  edevApi({ action: 'add', nom: nom, prenom: prenom, type: f.type, periode: f.periode === 'Journée entière' ? '' : f.periode, date_debut: f.d1, date_fin: d2, commentaire: f.comment })
    .then(function(res){

        var jump = edevIsoDay(f.d1);
        EDEV_FORM.busy = false; EDEV_FORM.d1 = ''; EDEV_FORM.d2 = ''; EDEV_FORM.comment = ''; EDEV_FORM.who = (f.who === '__autre' ? '' : f.who); EDEV_FORM.nom = ''; EDEV_FORM.prenom = '';
        if (jump) EDEV_CUR = new Date(jump.getFullYear(), jump.getMonth(), 1);
        EDEV_SEL = null;
        EDEV_FORM.msg = 'Saisie enregistrée ✔'; EDEV_FORM.err = false;
        renderEdev();
      });
    })
    .catch(function(e){ EDEV_FORM.busy = false; edevSetMsg('Erreur : ' + (e && e.message ? e.message : 'réessayez') + '.', true); if (btn) btn.disabled = false; });
}
function edevDelete(id){

}

function renderEdev(){
  var panel = document.getElementById('sec-edev');
  if (!panel) return;
  var now = new Date(); var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (!EDEV_CUR) EDEV_CUR = new Date(today.getFullYear(), today.getMonth(), 1);
  var items = edevItems();

  // Face + apercu : absents aujourd'hui (valides) et prochaines absences
  var absToday = {}, upcoming = [];
  items.forEach(function(c){
    var fin = c.fin || c.debut;
    if (edevIsValide(c) && c.debut <= today && fin >= today) absToday[normalizeNom(c.nom) + '|' + normalizeNom(c.prenom)] = true;
    if (fin >= today) upcoming.push(c);
  });
  upcoming.sort(function(a,b){ return a.debut - b.debut; });

  var detail = '';

/* ============================ PLANNING DIRECTEURS (Edgard + GdO) ============================ */
var DIRS_CUR = null, DIRS_SEL = null, DIRS_ENS = 'all', DIRS_ONLY = false;
var N_JOURS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

function dirsParseName(full){
  var t = String(full||'').trim().split(/\s+/).filter(Boolean);
  if (!t.length) return { nom: '', prenom: '' };
  var i = 0;
  while (i < t.length - 1 && t[i] === t[i].toLocaleUpperCase('fr') && /[A-Za-zÀ-ÿ]/.test(t[i])) i++;
  if (i === 0) i = 1;
  return { nom: t.slice(0, i).join(' '), prenom: t.slice(i).join(' ') };
}
function dirsPerson(full, email){
  var n = dirsParseName(full);
  var k1 = normalizeNom(n.nom + n.prenom), k2 = normalizeNom(n.prenom + n.nom);
  return { nom: edevNom(n.nom), prenom: edevPrenom(n.prenom), email: email || '', keys: [k1, k2], label: (edevPrenom(n.prenom) + ' ' + edevNom(n.nom)).trim() };
}
function dirsLoad(){
  return authRead('directeurs').then(function(res){
    var rows = ((res && res.values) || []).slice(1);
    return rows.filter(function(r){ return r[1] && r[2]; }).map(function(r){
      var ens = /g[ée]n[ée]rale|gdo/i.test(String(r[0]||'')) ? 'GdO' : 'Edgard';
      var mag = String(r[1]).trim();
      return { ens: ens, mag: mag.charAt(0).toUpperCase() + mag.slice(1).toLowerCase(),
               dir: dirsPerson(r[2], String(r[3]||'').trim()),
               adj: String(r[4]||'').trim() ? dirsPerson(r[4], String(r[5]||'').trim()) : null };
    });
  }).catch(function(){ return null; });
}
/* Absences d'une personne : liste {debut, fin, cat, statut, type} d'apres les demandes (hors Edgard Dev, deja couvertes) */
function dirsAbsOf(person){
  var out = [];
  STATE.dirsAbs.forEach(function(c){
    if (person.keys.indexOf(c.k1) !== -1 || person.keys.indexOf(c.k2) !== -1) out.push(c);
  });
  return out;
}
function dirsKeySet(){
  var set = {};
  (STATE.dirs || []).forEach(function(r){ [r.dir, r.adj].forEach(function(pe){ if (pe) pe.keys.forEach(function(k){ set[k] = true; }); }); });
  return set;
}
function dirsBuildAbs(demandes){
  var keys = dirsKeySet(), hasKeys = Object.keys(keys).length > 0;
  STATE.dirsBase = demandes
    .filter(function(d){ return ['valide','en_attente','telecharge','attente_telechargement'].indexOf(d.statut) !== -1; })
    .map(function(d){
      var debut = edevDay(d.date_debut);
      return { rid: d.id, lien: d.lien || '', nom: d.nom, prenom: d.prenom,
               k1: normalizeNom(d.nom) + normalizeNom(d.prenom), k2: normalizeNom(d.prenom) + normalizeNom(d.nom),
               type: d.type, statut: d.statut, debut: debut, fin: edevDay(d.date_fin) || debut };
    })
    .filter(function(c){ return c.debut && (!hasKeys || keys[c.k1] || keys[c.k2]); });
  dirsRebuild();
}
function dirsStateOn(person, day){
  // retourne la meilleure absence couvrant `day` : validee prioritaire sur en attente
  var best = null;
  dirsAbsOf(person).forEach(function(c){
    if (c.debut <= day && c.fin >= day){
      var valide = c.statut !== 'en_attente';
      if (!best || (valide && !best.valide)) best = { valide: valide, cat: edevCat(c), type: c.type, motif: c.motif || '', rid: c.rid, debut: c.debut, fin: c.fin };
    }
  });
  return best;
}
function dirsFmt(d){ return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }); }
function dirsTypeLib(st){ if (st.motif) return absMotifLib(st.motif); var u = String(st.type||'').toUpperCase(); return u === 'CP' ? 'Congés payés' : (u === 'CP+ABS' ? 'CP + absence' : 'Absence'); }
function dirsShift(n){ DIRS_CUR = new Date(DIRS_CUR.getFullYear(), DIRS_CUR.getMonth() + n, 1); renderDirs(); }
function dirsToday(){ var t = new Date(); DIRS_CUR = new Date(t.getFullYear(), t.getMonth(), 1); DIRS_SEL = null; renderDirs(); }
function dirsSelect(k){ DIRS_SEL = (DIRS_SEL === k ? null : k); renderDirs(); }
function dirsEns(v){ DIRS_ENS = v; renderDirs(); }
function dirsOnly(){ DIRS_ONLY = !DIRS_ONLY; renderDirs(); }

function renderDirs(){

  document.getElementById('dirs-count').textContent = absNow.length;
  document.getElementById('dirs-count').className = 'n' + (absNow.length === 0 ? ' ok' : '');
  var pv = absNow.slice(0, 2).map(function(r){ return '<div class="pv-item">' + esc(r.dir.prenom) + ' ' + esc(r.dir.nom.charAt(0)) + '. — ' + esc(r.mag) + '</div>'; }).join('');

  var absSel = STATE.dirs.filter(function(r){ var st = dirsStateOn(r.dir, selDay); return st && st.valide; });
  var isToday = edevKey(selDay) === edevKey(today);
  var contact = '<div class="dcontact"><h4>Qui contacter — ' + (isToday ? 'aujourd\'hui, ' : '') + selDay.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) + '</h4>';
  if (!absSel.length) contact += '<div class="ok">✔ Tous les directeurs sont présents ce jour-là.</div>';
  else contact += absSel.map(function(r){

    var until = st.fin >= st.debut ? ' (jusqu\'au ' + dirsFmt(st.fin) + ')' : '';
    var to;
    if (r.adj){
      var adjSt = dirsStateOn(r.adj, selDay);
      if (adjSt && adjSt.valide) to = '<span class="none">Adjoint ' + esc(r.adj.label) + ' également absent</span>';

  }).join('');
  contact += '</div>';

  // Grille du mois
  var y = DIRS_CUR.getFullYear(), m = DIRS_CUR.getMonth();
  var nDays = new Date(y, m + 1, 0).getDate();
  var head = '<th class="first">Magasin · directeur</th>';

    head += '<th class="' + (dow === 0 || dow === 6 ? 'wk ' : '') + (k === edevKey(today) ? 'today ' : '') + (DIRS_SEL === k ? 'sel' : '') + '" onclick="dirsSelect(\'' + k + '\')" title="Voir qui contacter ce jour">' + d + '<small>' + N_JOURS[dow] + '</small></th>';
  }
  var rowsHtml = '', lastEns = '';
  STATE.dirs.filter(function(r){ return DIRS_ENS === 'all' || r.ens === DIRS_ENS; }).forEach(function(r){
    var cells = '', anyAbs = false;
    for (var d2 = 1; d2 <= nDays; d2++){
      var dt2 = new Date(y, m, d2), k2 = edevKey(dt2), dow2 = dt2.getDay();
      var st = dirsStateOn(r.dir, dt2);
      var cls = 'c' + (dow2 === 0 || dow2 === 6 ? ' wk' : '') + (k2 === edevKey(today) ? ' today' : '') + (DIRS_SEL === k2 ? ' sel' : '');
      if (st){
        anyAbs = true;
        var title = r.dir.label + ' — ' + dirsTypeLib(st) + (st.valide ? ' (validé)' : ' (en attente)') + ' du ' + dirsFmt(st.debut) + ' au ' + dirsFmt(st.fin) + (r.adj ? ' · adjoint : ' + r.adj.label : '') + (st.cat !== 'cp' ? ' · cliquer pour préciser le type' : '');
        cells += '<td class="' + cls + (st.cat !== 'cp' ? ' pick' : '') + '" title="' + esc(title) + '"' + (st.cat !== 'cp' ? ' onclick="absPick(\'' + attrSafe(String(st.rid)) + '\')"' : '') + '><span class="b ' + st.cat + '-' + (st.valide ? 'valide' : 'attente') + '"></span></td>';
      } else cells += '<td class="' + cls + '"></td>';
    }
    if (DIRS_ONLY && !anyAbs) return;
    if (r.ens !== lastEns){ lastEns = r.ens; rowsHtml += '<tr class="sep"><td colspan="' + (nDays + 1) + '">' + (r.ens === 'GdO' ? 'Générale d\'Optique' : 'Edgard Opticiens') + '</td></tr>'; }
    rowsHtml += '<tr><td class="first"><div class="mag">' + esc(r.mag) + '</div><div class="who">' +
      (r.dir.email ? '<a href="mailto:' + esc(r.dir.email) + '">' + esc(r.dir.label) + '</a>' : esc(r.dir.label)) + '</div>' +
      (r.adj ? '<div class="adj">Adjoint : ' + (r.adj.email ? '<a href="mailto:' + esc(r.adj.email) + '">' + esc(r.adj.label) + '</a>' : esc(r.adj.label)) + '</div>' : '<div class="adj">Pas d\'adjoint</div>') +
      '</td>' + cells + '</tr>';
  });
  if (!rowsHtml) rowsHtml = '<tr><td class="first" colspan="' + (nDays + 1) + '" style="padding:18px;color:#888">Aucune absence de directeur sur ce mois.</td></tr>';

  body.innerHTML = contact +
    '<div class="ecal-bar"><button onclick="dirsShift(-1)">‹ Précédent</button><span class="lbl">' + EDEV_MOIS[m] + ' ' + y + '</span><button onclick="dirsShift(1)">Suivant ›</button><button onclick="dirsToday()">Aujourd\'hui</button></div>' +
    '<div class="dfilters">' +
      '<button class="pill' + (DIRS_ENS === 'all' ? ' on' : '') + '" onclick="dirsEns(\'all\')">Tous</button>' +
      '<button class="pill' + (DIRS_ENS === 'Edgard' ? ' on' : '') + '" onclick="dirsEns(\'Edgard\')">Edgard</button>' +
      '<button class="pill' + (DIRS_ENS === 'GdO' ? ' on' : '') + '" onclick="dirsEns(\'GdO\')">GdO</button>' +
      '<button class="pill' + (DIRS_ONLY ? ' on' : '') + '" onclick="dirsOnly()">Uniquement les absents du mois</button>' +
    '</div>' +
    '<div class="ecal-legend">' +
      '<span class="li"><span class="sw" style="background:var(--green)"></span>CP validé</span>' +
      '<span class="li"><span class="sw" style="background:#E3F5E9;border:1.5px dashed var(--green)"></span>CP en attente</span>' +
      '<span class="li"><span class="sw" style="background:var(--blue)"></span>RTT</span>' +
      '<span class="li"><span class="sw" style="background:var(--orange)"></span>Absence validée</span>' +
      '<span class="li"><span class="sw" style="background:#FDEBD8;border:1.5px dashed var(--orange)"></span>Absence en attente</span>' +
      '<span class="li">Cliquez sur un jour pour voir qui contacter ce jour-là</span>' +
    '</div>' +
    '<div class="dgrid-wrap"><table class="dgrid"><thead><tr>' + head + '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';
}
